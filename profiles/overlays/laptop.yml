---
name: Laptop Features Overlay
description: |
  Adds laptop-specific roles when laptop=true in group_vars/all/local.yml.

applies_when: "laptop | default(false)"

roles:
  - { role: laptop, tags: [laptop], section: optional }
  - { role: network_shares, tags: [network_shares], section: optional }
  - { role: backlight, tags: [backlight], requires_display: true, section: desktop_apps }

---
name: Base System
description: |
  Core roles that run on all configurations regardless of desktop environment.
  Includes system utilities, development tools, package managers, networking.

display_manager_default: ""
desktop_environment: ""

roles:
  # GPU Detection & Drivers
  - { role: gpu_detect, tags: [gpu_detect], os: archlinux, section: gpu }
  - { role: gpu_drivers, tags: [gpu_drivers], os: archlinux, section: gpu }

  # Base System (Arch-only)
  - { role: base, tags: [base], os: archlinux, section: base }
  - { role: grub, tags: [grub], os: archlinux, section: base }
  - { role: microcode, tags: [microcode], os: archlinux, section: base }

  # Universal System Configuration
  - { role: sysmon, tags: [sysmon], section: universal }
  - { role: cron, tags: [cron], section: universal }
  - { role: system, tags: [system], section: universal }
  - { role: ssh, tags: [ssh], section: universal }
  - { role: archive, tags: [archive], section: universal }

  # Package Management
  - { role: ansible-role-packages, tags: [packages], section: packages }
  - { role: ansible-role-asdf, tags: [asdf], section: packages }
  - { role: flatpak, tags: [flatpak], section: packages }
  - { role: golang, tags: [golang], os: debian, section: packages }
  - { role: homebrew, tags: [homebrew], os: debian, section: packages }
  - { role: ansible-role-binaries, tags: [binaries], os: debian, section: packages }

  # AUR (Arch-only)
  - { role: aur, tags: [aur], os: archlinux, section: packages }

  # Development Tools
  - { role: editors, tags: [editors], section: dev }
  - { role: filesystem, tags: [filesystem], section: dev }
  - { role: python, tags: [python], section: dev }
  - { role: rust, tags: [rust], section: dev }
  - { role: docker, tags: [docker], os: archlinux, section: dev }
  - { role: kubernetes, tags: [kubernetes], os: archlinux, section: dev }

  # Display-gated Development (Arch-only, filtered out for headless)
  - { role: devtools, tags: [devtools], os: archlinux, requires_display: true, section: dev }

  # AI Development Tools (moved to user overlay — roles/overlays/user.yml)

  # Networking (Arch-only)
  - { role: nmtrust, tags: [nmtrust], os: archlinux, requires_display: true, section: networking }
  - { role: networkmanager, tags: [networkmanager], os: archlinux, requires_display: true, section: networking }
  - { role: nettools, tags: [nettools], os: archlinux, section: networking }
  - { role: mirrorlist, tags: [mirrorlist], os: archlinux, section: networking }
  - { role: filesharing, tags: [filesharing], os: archlinux, section: networking }

  # Communication (Arch-only, requires display)
  - { role: communication, tags: [communication], os: archlinux, requires_display: true, section: desktop_apps }

  # Productivity & Utilities
  - { role: taskwarrior, tags: [taskwarrior], os: archlinux, section: productivity }
  - { role: pass, tags: [pass], os: archlinux, section: productivity }
  - { role: pass_cli, tags: [pass_cli], section: productivity }
  - { role: spell, tags: [spell], section: productivity }
  - { role: clipboard, tags: [clipboard], os: archlinux, section: productivity }
  - { role: clouddrive, tags: [clouddrive], os: archlinux, section: productivity }
  - { role: syncthing, tags: [syncthing], section: productivity }

  # Optional / Feature-gated
  - { role: goesimage, tags: [goesimage], config_check: "goesimage is defined", requires_display: true, section: optional }
  - { role: regdomain, tags: [regdomain], config_check: "regdomain is defined", section: optional }

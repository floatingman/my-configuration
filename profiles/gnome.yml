---
name: GNOME Desktop Environment
description: |
  Full GNOME desktop with GDM display manager.
  FIXES BUG from original play.yml where gdm/gnome never installed.
  Original bug: when: not ("desktop_environment is defined") and "desktop_environment == 'gnome'"
  This evaluates to: NOT true AND (truthy string) = false — GNOME never ran.

extends: _base.yml

display_manager_default: gdm
desktop_environment: gnome

requires:
  display_manager: true

roles:
  # Display Manager (GNOME requires GDM)
  - role: gdm
    tags: [gdm]
    requires_config:
      display_manager: gdm
    section: display_manager

  # GNOME Desktop
  - role: gnome
    tags: [gnome]
    section: gnome_profile

  # Display Infrastructure
  - { role: x, tags: [x], section: i3_profile }

  # Fonts & Theming
  - { role: fonts, tags: [fonts], os: archlinux, requires_display: true, section: fonts_theming }
  - { role: nerd-fonts, tags: [fonts], requires_display: true, section: fonts_theming }
  - role: cursor-theme
    tags: [cursor-theme]
    requires_display: true
    config_check: "cursor_theme.enabled"
    section: fonts_theming

  # Desktop Applications
  - { role: terminal, tags: [terminal], requires_display: true, section: desktop_apps }
  - { role: notes, tags: [notes], requires_display: true, section: desktop_apps }
  - { role: browsers, tags: [browsers], requires_display: true, section: desktop_apps }
  - { role: filemanager, tags: [filemanager], requires_display: true, section: desktop_apps }
  - { role: screensaver, tags: [screensaver], requires_display: true, section: desktop_apps }
  - { role: mpv, tags: [mpv], requires_display: true, section: desktop_apps }
  - { role: media, tags: [media], requires_display: true, section: desktop_apps }
  - { role: sound, tags: [sound], requires_display: true, section: desktop_apps }
  - { role: proton, tags: [proton], requires_display: true, section: desktop_apps }
  - { role: android, tags: [android], requires_display: true, section: desktop_apps }
  - { role: backlight, tags: [backlight], requires_display: true, section: desktop_apps }
  - { role: mpd, tags: [mpd], requires_display: true, section: desktop_apps }
  - { role: twitch, tags: [twitch], requires_display: true, section: desktop_apps }

  # Arch-specific (display-dependent)
  - { role: cups, tags: [cups], os: archlinux, requires_display: true, section: desktop_apps }
  - { role: udisks, tags: [udisks], os: archlinux, requires_display: true, section: desktop_apps }

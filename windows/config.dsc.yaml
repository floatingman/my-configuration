# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# Desired state for the Windows machine(s) (WinGet Configuration).
# Manifest v0.2.0: curated from a winget export of blurr (2026-11-13).
#
# Apply:    .\windows\bootstrap.ps1
# Drift:    .\windows\bootstrap.ps1 -Test     (changes nothing)
# Re-sync:  winget export -o "$env:TEMP\apps.json" --accept-source-agreements
#           .\windows\from-export.ps1 "$env:TEMP\apps.json" -Diff
#
# Hand-edited: NOT generated from profiles/, NOT covered by make check-sync.
# Deliberately NOT declared (see windows/README.md): runtimes/drivers installed
# as dependencies, hardware-vendor apps, and licensed tools (UniGet/manual lane).


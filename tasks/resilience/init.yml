---
# Resilience initialization, included from play.yml pre_tasks (tags: always).
#
# Starts every run with an empty failure collector and immediately writes a
# fresh in-progress report (replacing any report from a previous run), so
# `make rerun-failed` always acts on the run that just happened. Because the
# report is rewritten after every recorded failure as well (see
# record-role-failure.yml) and at the end of the run (failure-report.yml),
# even a play that aborts mid-way leaves a report of the failures collected
# so far, marked status: in-progress.
#
# Variables (all optional; see README section "Error resilience"):
#   resilience_report_path - where the end-of-run report is written
#     (default: ~/.cache/my-configuration/failures.json)

- name: Start the run with an empty resilience failure collector
  ansible.builtin.set_fact:
    _resilience_failures: []

- name: Remove the failure report from previous runs
  ansible.builtin.file:
    path: "{{ resilience_report_path | default(lookup('env', 'HOME') ~ '/.cache/my-configuration/failures.json') }}"
    state: absent
  # Real deletion even under --check: a simulated delete would let a stale
  # report survive an aborted check run and mislead `make rerun-failed`.
  check_mode: false

- name: Write the initial in-progress resilience report
  ansible.builtin.include_tasks: tasks/resilience/write-report.yml
  vars:
    _resilience_report_status: in-progress

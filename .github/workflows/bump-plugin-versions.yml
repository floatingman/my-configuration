name: bump-plugin-versions

# Weekly bot that opens a PR when any pinned zsh/tmux plugin version in
# roles/shell/defaults/main.yml is behind upstream. Pins only move through
# review; the playbook itself never floats.

on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bump pinned plugin versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/bump_plugin_versions.py | tee /tmp/bump-report.txt

      - name: Validate defaults still parses
        run: |
          pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('roles/shell/defaults/main.yml'))"

      - name: Open pull request if pins changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && { echo "All pins current — nothing to do."; exit 0; }
          branch="bump/plugin-versions-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add roles/shell/defaults/main.yml
          git commit -m "chore(shell): bump pinned plugin versions" -m "$(cat /tmp/bump-report.txt)"
          git push origin "$branch"
          gh pr create \
            --base main \
            --title "chore(shell): bump pinned plugin versions" \
            --body "Automated weekly pin refresh (scripts/bump_plugin_versions.py).

          $(cat /tmp/bump-report.txt)

          Note: this PR was opened with the default \`GITHUB_TOKEN\`, which
          does not trigger \`pull_request\` workflows — the bump job above
          already validated the YAML parses. The diff is version-pin-only."

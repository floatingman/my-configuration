---
- name: Install xdg-user-dirs
  ansible.builtin.package:
    name: xdg-user-dirs
    state: present
  become: true
  tags:
    - xdg

- name: Create user directories
  # xdg-user-dirs-update creates missing ~/ subdirs and rewrites
  # ~/.config/user-dirs.dirs only when its content changes; report changed
  # only when it actually did something (a directory was missing or the
  # dirs file changed), so repeat runs stay idempotent.
  ansible.builtin.shell:
    cmd: |
      set -e -o pipefail
      home=/home/{{ user.name }}
      dirs_file="$home/.config/user-dirs.dirs"
      before=$(sha256sum "$dirs_file" 2>/dev/null | cut -d' ' -f1)
      missing=$(sed -n 's/^XDG_[A-Z_]*DIR="\$HOME\/\(.*\)"$/\1/p' "$dirs_file" 2>/dev/null | while read -r d; do [ -e "$home/$d" ] || echo "$d"; done)
      /usr/bin/xdg-user-dirs-update >/dev/null
      after=$(sha256sum "$dirs_file" 2>/dev/null | cut -d' ' -f1)
      if [ "$before" != "$after" ] || [ -n "$missing" ]; then echo changed; fi
    executable: /bin/bash
  register: x_xdg_user_dirs
  changed_when: x_xdg_user_dirs.stdout == 'changed'
  become: true
  become_user: "{{ user.name }}"
  tags:
    - xdg

- name: Install perl-file-mimeinfo
  ansible.builtin.package:
    name: perl-file-mimeinfo
    state: present
  become: true
  when: ansible_facts["os_family"]=="Archlinux"
  tags:
    - xdg

- name: Install perl-file-mimeinfo
  ansible.builtin.package:
    name: libfile-mimeinfo-perl
    state: present
  become: true
  when: ansible_facts["os_family"]=="Debian"
  tags:
    - xdg

---
- name: Install twitch streamlink
  become: true
  kewlfft.aur.aur:
    name: streamlink-twitch-gui-bin
    use: auto
    state: present
  become_user: aur_builder
  when: ansible_facts["os_family"] == "Archlinux"
  tags:
    - aur


- name: Install streamlink CLI (Fedora)
  # The streamlink-twitch-gui wrapper is AUR-only; the engine is packaged
  # as python3-streamlink.
  become: true
  ansible.builtin.package:
    name: python3-streamlink
    state: present
  when: ansible_facts["os_family"] == "RedHat"


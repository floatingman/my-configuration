---
# Wayland userland and theming. The AUR arms are Arch-gated; the generic
# package tasks are Fedora-safe unless noted per task (Fedora 43 repodata,
# 2026-11: no binary package is named "wayland" and cliphist is unpackaged,
# so both skip Fedora; the Arch "breeze" metapackage maps to plasma-breeze).
- name: Install wayland
  ansible.builtin.package:
    name: wayland
    state: present
  become: true
  when: ansible_facts["distribution"] != "Fedora"
- name: Install cliphist
  ansible.builtin.package:
    name: cliphist
    state: present
  become: true
  when: ansible_facts["distribution"] != "Fedora"
- name: Install xdg-user-dirs
  ansible.builtin.package:
    name: xdg-user-dirs
    state: present
  become: true
- name: Install adw-gtk-theme-git
  become: true
  kewlfft.aur.aur:
    name: adw-gtk-theme-git
    use: auto
    state: present
  become_user: aur_builder
  when: ansible_facts["os_family"] == "Archlinux"
  tags:
    - aur
- name: Install breeze
  ansible.builtin.package:
    name: breeze
    state: present
  become: true
  when: ansible_facts["distribution"] != "Fedora"

- name: Install plasma-breeze
  # Fedora splits the Arch "breeze" metapackage; plasma-breeze carries the
  # artwork/styles (verified: Fedora 43 repodata, 2026-11).
  ansible.builtin.package:
    name: plasma-breeze
    state: present
  become: true
  when: ansible_facts["distribution"] == "Fedora"
- name: Install breeze-plus
  become: true
  kewlfft.aur.aur:
    name: breeze-plus
    use: auto
    state: present
  become_user: aur_builder
  when: ansible_facts["os_family"] == "Archlinux"
  tags:
    - aur
- name: Install darkly-bin
  become: true
  kewlfft.aur.aur:
    name: darkly-bin
    use: auto
    state: present
  become_user: aur_builder
  when: ansible_facts["os_family"] == "Archlinux"
  tags:
    - aur
- name: Install kde-material-you-colors
  become: true
  kewlfft.aur.aur:
    name: kde-material-you-colors
    use: auto
    state: present
  become_user: aur_builder
  when: ansible_facts["os_family"] == "Archlinux"
  tags:
    - aur
- name: Install matugen-bin
  become: true
  kewlfft.aur.aur:
    name: matugen-bin
    use: auto
    state: present
  become_user: aur_builder
  when: ansible_facts["os_family"] == "Archlinux"
  tags:
    - aur

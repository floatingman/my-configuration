---
- name: Install Synology Drive
  become: true
  kewlfft.aur.aur:
    name: synology-drive
    use: auto
    state: present
  become_user: aur_builder
  when: ansible_facts["os_family"] == "Archlinux"
  tags:
    - aur

- name: Install Synology Drive power gate script
  become: true
  ansible.builtin.template:
    src: synology-drive-power-gate.sh.j2
    dest: /usr/local/bin/synology-drive-power-gate.sh
    mode: '0755'
  when: clouddrive_stop_on_battery | default(false) | bool

- name: Install Synology Drive power gate udev rule
  become: true
  ansible.builtin.copy:
    src: 99-synology-drive-power-gate.rules
    dest: /etc/udev/rules.d/
    mode: '0644'
  when: clouddrive_stop_on_battery | default(false) | bool
  notify:
    - Reload udev rules

- name: Install power-gated Synology Drive user unit
  become: true
  ansible.builtin.template:
    src: synology-drive.service.j2
    dest: /etc/systemd/user/synology-drive.service
    mode: '0644'
  when: clouddrive_stop_on_battery | default(false) | bool
  notify:
    - Reload Synology user systemd config

- name: Enable power-gated Synology Drive user unit
  become: true
  become_user: "{{ user.name }}"
  ansible.builtin.systemd:
    scope: user
    name: synology-drive.service
    enabled: true
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ user.uid }}"
  when: clouddrive_stop_on_battery | default(false) | bool
- name: Check gated Synology Drive unit state  # noqa: command-instead-of-module
  become: true
  become_user: "{{ user.name }}"
  ansible.builtin.command: systemctl --user is-active synology-drive.service
  register: _clouddrive_unit_state
  changed_when: false
  failed_when: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ user.uid }}"
  when: clouddrive_stop_on_battery | default(false) | bool

- name: Gracefully stop vendor-autostarted Synology Drive tree
  # migration: the autostart-spawned tree runs outside any unit, so gate
  # stops would miss it and it would survive on battery until logout.
  # Only runs when the gated unit is not active, so an AC-managed tree is
  # never touched.
  become: true
  ansible.builtin.command: pkill -TERM -u {{ user.name }} -f SynologyDrive.app/bin/cloud-drive
  register: _clouddrive_migrate_term
  changed_when: _clouddrive_migrate_term.rc == 0
  failed_when: _clouddrive_migrate_term.rc not in [0, 1]
  when:
    - clouddrive_stop_on_battery | default(false) | bool
    - _clouddrive_unit_state.stdout | default('inactive') != 'active'
  notify:
    - Apply Synology power gate

- name: Force-stop surviving Synology Drive processes
  # cloud-drive-ui ignores SIGTERM; give the graceful signal a moment
  become: true
  ansible.builtin.command: pkill -KILL -u {{ user.name }} -f SynologyDrive.app/bin/cloud-drive
  register: _clouddrive_migrate_kill
  changed_when: _clouddrive_migrate_kill.rc == 0
  failed_when: _clouddrive_migrate_kill.rc not in [0, 1]
  when:
    - clouddrive_stop_on_battery | default(false) | bool
    - _clouddrive_unit_state.stdout | default('inactive') != 'active'
    - _clouddrive_migrate_term.rc | default(1) == 0

- name: Remove XDG autostart entry superseded by the user unit
  become: true
  become_user: "{{ user.name }}"
  ansible.builtin.file:
    path: "/home/{{ user.name }}/.config/autostart/synology-drive-autostart.desktop"
    state: absent
  when: clouddrive_stop_on_battery | default(false) | bool

- name: Check whether the power-gated user unit is installed
  # The disable below only makes sense on the one-time cleanup transition:
  # "Remove power gate artifacts" deletes the unit file, and disabling a
  # unit with no file fails with "Could not find the requested service".
  ansible.builtin.stat:
    path: /etc/systemd/user/synology-drive.service
  register: _clouddrive_gated_unit_installed
  when: not (clouddrive_stop_on_battery | default(false) | bool)

- name: Disable power-gated Synology Drive user unit
  become: true
  become_user: "{{ user.name }}"
  ansible.builtin.systemd:
    scope: user
    name: synology-drive.service
    enabled: false
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ user.uid }}"
  when:
    - not (clouddrive_stop_on_battery | default(false) | bool)
    - _clouddrive_gated_unit_installed.stat.exists | default(false)

- name: Remove power gate artifacts
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/user/synology-drive.service
    - /etc/udev/rules.d/99-synology-drive-power-gate.rules
    - /usr/local/bin/synology-drive-power-gate.sh
  when: not (clouddrive_stop_on_battery | default(false) | bool)
  notify:
    - Reload udev rules
    - Reload Synology user systemd config

- name: Ensure autostart directory exists
  become: true
  become_user: "{{ user.name }}"
  ansible.builtin.file:
    path: "/home/{{ user.name }}/.config/autostart"
    state: directory
    mode: '0755'
  when: not (clouddrive_stop_on_battery | default(false) | bool)

- name: Restore Synology Drive XDG autostart entry
  become: true
  become_user: "{{ user.name }}"
  ansible.builtin.template:
    src: synology-drive-autostart.desktop.j2
    dest: "/home/{{ user.name }}/.config/autostart/synology-drive-autostart.desktop"
    mode: '0644'
  when: not (clouddrive_stop_on_battery | default(false) | bool)

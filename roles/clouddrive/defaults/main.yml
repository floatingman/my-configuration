---
# Stop the Synology Drive client while on battery (power gating).
# true: replaces the app's XDG autostart entry with a systemd user unit
# (cgroup owns the whole cloud-drive process tree) that a udev power gate
# stops on battery and starts on external power; logins on battery stay off
# via an ExecStartPre check.
# null/false: plain vendor autostart; unit, gate script and udev rule are
# removed and the autostart entry restored.

# Fedora has no vendor RPM (Synology ships Linux builds as an Ubuntu .deb
# only), so the role stages that deb and extracts its payload — the same
# repack the AUR performs on Arch. Bump the version pin to upgrade; the
# changed download re-runs the extraction.
clouddrive_fedora_deb_url: >-
  https://global.synologydownload.com/download/Utility/SynologyDriveClient/4.2.1-20062/Ubuntu/Installer/synology-drive-client-20062.x86_64.deb
clouddrive_fedora_stage_dir: /var/tmp/synology-drive

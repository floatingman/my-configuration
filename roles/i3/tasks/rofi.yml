---
- name: Install rofi
  become: true
  ansible.builtin.package:
    name:
      - rofi
    state: present
  tags:
    - rofi

- name: Install i3-wm for rofi window switching
  become: true
  ansible.builtin.package:
    name:
      # Name split mirrors the main install task: "i3" on Fedora, i3-wm elsewhere.
      - "{{ 'i3' if ansible_facts['os_family'] == 'RedHat' else 'i3-wm' }}"
    state: present
  tags:
    - rofi

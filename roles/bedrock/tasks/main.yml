---
# SUSE bedrock-toolkit CLI — per-user install + guarded AWS SSO/Bedrock setup.
#
# 1. Installs the `bedrock` binary into ~/.local/bin (same pattern as pass_cli:
#    version-probe, download only on change, user-owned files, no become).
# 2. Writes the SSO profile into ~/.aws/config as a marked block — never
#    templates the whole file, the user may have other profiles. A profile
#    written manually (team guide Step 2) is detected and adopted.
# 3. Runs `bedrock setup` only when a valid SSO session exists. Browser sign-in
#    (`aws sso login`) cannot be automated: without a session the run still
#    succeeds and prints the exact manual next steps.
#
# Company-private variables (start URL directory id, CLZ account id, permission
# set, the admin's --id value) live ONLY in the gitignored
# group_vars/all/local.yml and are never echoed into task names or messages.

# --- Prerequisites -----------------------------------------------------------

# curl + tar back the get_url/unarchive pair below. Present on Arch and Debian
# by default; assert rather than assume.
- name: Ensure download/extract dependencies are present (curl, tar)
  ansible.builtin.package:
    name:
      - curl
      - tar
    state: present
  become: true

# --- Per-user CLI install ----------------------------------------------------

- name: Ensure per-user install directory exists
  ansible.builtin.file:
    path: "{{ bedrock_install_dir }}"
    state: directory
    mode: '0755'

# Probe the installed version (rc != 0 when the binary is absent). Compared by
# substring so any "name version ..." output format works. The version guard
# keeps the ~10 MB download off every playbook run. Read-only, so it also runs
# in check mode.
- name: Detect installed bedrock version
  ansible.builtin.command: "{{ bedrock_install_dir }}/bedrock --version"
  register: bedrock_installed_raw
  changed_when: false
  failed_when: false
  check_mode: false

# get_url with a sha256sum-format checksums URL verifies the line matching the
# dest basename — the same guarantee upstream's install.sh relies on.
- name: Download bedrock release tarball (v{{ bedrock_version }})
  ansible.builtin.get_url:
    url: "https://github.com/SUSE/bedrock-toolkit/releases/download/v{{ bedrock_version }}/bedrock_{{ bedrock_version }}_linux_amd64.tar.gz"
    dest: "/tmp/bedrock_{{ bedrock_version }}_linux_amd64.tar.gz"
    checksum: "sha256:https://github.com/SUSE/bedrock-toolkit/releases/download/v{{ bedrock_version }}/checksums.txt"
    mode: '0644'
  when: bedrock_version not in bedrock_installed_raw.stdout

# Stat the tarball before the artifact-dependent tasks: in check mode get_url
# only *reports* the download, so the extract/permissions/cleanup tasks below
# must stay off a missing file during a dry run (vidsummarizer pattern).
- name: Check whether the release tarball is present
  ansible.builtin.stat:
    path: "/tmp/bedrock_{{ bedrock_version }}_linux_amd64.tar.gz"
  register: bedrock_tarball_stat

# Extract only the binary (it sits at the archive root), like install.sh's
# `tar -xzf ... bedrock`. No become: the binary must stay user-owned so future
# self-replacement keeps working, same reasoning as pass_cli.
- name: Extract bedrock binary into install directory
  ansible.builtin.unarchive:
    src: "/tmp/bedrock_{{ bedrock_version }}_linux_amd64.tar.gz"
    dest: "{{ bedrock_install_dir }}"
    remote_src: true
    extra_opts:
      - bedrock
  when: bedrock_version not in bedrock_installed_raw.stdout and not (ansible_check_mode and not bedrock_tarball_stat.stat.exists)
  changed_when: true

- name: Ensure bedrock binary has standard permissions
  ansible.builtin.file:
    path: "{{ bedrock_install_dir }}/bedrock"
    mode: '0755'
  when: bedrock_version not in bedrock_installed_raw.stdout and not (ansible_check_mode and not bedrock_tarball_stat.stat.exists)

- name: Remove temporary tarball
  ansible.builtin.file:
    path: "/tmp/bedrock_{{ bedrock_version }}_linux_amd64.tar.gz"
    state: absent
  when: bedrock_version not in bedrock_installed_raw.stdout and not (ansible_check_mode and not bedrock_tarball_stat.stat.exists)

# --- AWS SSO profile (~/.aws/config) ------------------------------------------

- name: Ensure AWS config directory exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.aws"
    state: directory
    mode: '0700'

# rc 0: profile present; rc 1: no match; rc 2: config file absent (fresh
# machine). rc 1 and rc 2 both count as "absent" for the blockinfile guard.
# Fixed-string whole-line matching (-F -x): profile names may contain regex
# metachars (dots), and an unescaped name must never match a different header.
- name: Detect existing SSO profile in AWS config
  ansible.builtin.command:
    argv:
      - grep
      - -c
      - -F
      - -x
      - "[profile {{ bedrock_sso_profile_name }}]"
      - "{{ lookup('env', 'HOME') }}/.aws/config"
  register: bedrock_existing_profile
  changed_when: false
  failed_when: bedrock_existing_profile.rc not in [0, 1, 2]

# A [profile ...] header alone can't tell "written by this role" from "written
# by hand". This check answers the reconcile question directly: rc 0 = the
# requested header sits inside our managed block (safe to rewrite); rc 1 = it
# does not. That rc-1 case covers both "profile absent entirely" and "an
# unmanaged profile with this name exists elsewhere in the file" - the latter
# must be adopted untouched, because writing a managed copy would produce a
# duplicate header and break AWS config parsing. Exact string equality (no
# regex), so metachars in the profile name cannot widen the match.
- name: Detect the SSO profile inside the role-managed block
  ansible.builtin.command:
    argv:
      - awk
      - |
        /# BEGIN ANSIBLE MANAGED BLOCK bedrock sso/ {inblock=1}
        inblock && $0 == "[profile {{ bedrock_sso_profile_name }}]" {found=1}
        /# END ANSIBLE MANAGED BLOCK bedrock sso/ {inblock=0}
        END {exit !found}
      - "{{ lookup('env', 'HOME') }}/.aws/config"
  register: bedrock_managed_profile
  changed_when: false
  failed_when: bedrock_managed_profile.rc not in [0, 1, 2]

# Carries the company-private start URL, account id and permission set:
# no_log keeps the values (and the diff) out of playbook output and logs.
- name: Write SSO profile block into AWS config
  ansible.builtin.blockinfile:
    path: "{{ lookup('env', 'HOME') }}/.aws/config"
    create: true
    mode: '0600'
    marker: "# {mark} ANSIBLE MANAGED BLOCK bedrock sso"
    block: |
      [profile {{ bedrock_sso_profile_name }}]
      sso_start_url = {{ bedrock_sso_start_url }}
      sso_region = {{ bedrock_sso_region }}
      sso_account_id = {{ bedrock_sso_account_id }}
      sso_role_name = {{ bedrock_sso_role_name }}
      region = {{ bedrock_sso_region }}
      output = json
  no_log: true
  when:
    - bedrock_sso_start_url is not none
    - bedrock_sso_account_id is not none
    - bedrock_sso_role_name is not none
    - bedrock_existing_profile.rc != 0 or bedrock_managed_profile.rc == 0

- name: Set list of missing company-private SSO variables
  ansible.builtin.set_fact:
    bedrock_missing_sso_vars: "{{ (['bedrock_sso_start_url'] if bedrock_sso_start_url is none else [])
      + (['bedrock_sso_account_id'] if bedrock_sso_account_id is none else [])
      + (['bedrock_sso_role_name'] if bedrock_sso_role_name is none else []) }}"

# Names only — the values are company-private and must never be printed.
- name: Report missing company-private SSO variables
  ansible.builtin.debug:
    msg: >-
      bedrock: SSO profile NOT written; unset variables:
      {{ bedrock_missing_sso_vars | join(', ') }}.
      Set them in group_vars/all/local.yml (gitignored). The values come from
      the account/role picker shown by `aws configure sso`, the team's Bedrock
      user guide, or the CLZ account owner. Then re-run
      `make configure TAGS=bedrock`.
  when: bedrock_missing_sso_vars | length > 0

# --- AWS CLI assert + guarded bedrock setup -----------------------------------

# AWS CLI v2 is installed repo-wide via asdf (group_vars/all/base.yml); this
# role only asserts it is reachable. asdf shims are supplied explicitly: on a
# fresh machine the playbook's environment predates the profile.d snippet that
# puts them on PATH (pattern from roles/ai).
- name: Check AWS CLI availability
  ansible.builtin.command: aws --version
  environment:
    PATH: "/opt/asdf/bin:/opt/asdf/shims:{{ ansible_facts['env']['PATH'] }}"
    ASDF_DATA_DIR: "/opt/asdf"
  register: bedrock_aws_cli
  changed_when: false
  failed_when: false

- name: Fail with guidance when AWS CLI is missing
  ansible.builtin.fail:
    msg: >-
      AWS CLI v2 is required by the bedrock role but was not found on PATH.
      It is installed repo-wide via asdf; run `make configure TAGS=asdf`
      first, then re-run `make configure TAGS=bedrock`.
  when: bedrock_aws_cli.rc != 0

# `bedrock setup` needs a valid SSO session; `aws sso login` opens a browser
# and cannot be automated. Probe with STS: rc 0 means the cached session works.
# Probe only when the profile is usable: written above or pre-existing.
# no_log: a successful call prints the account id and caller ARN.
- name: Probe SSO session validity via STS
  ansible.builtin.command:
    argv:
      - aws
      - sts
      - get-caller-identity
      - --profile
      - "{{ bedrock_sso_profile_name }}"
  environment:
    PATH: "/opt/asdf/bin:/opt/asdf/shims:{{ ansible_facts['env']['PATH'] }}"
    ASDF_DATA_DIR: "/opt/asdf"
  register: bedrock_sso_session
  no_log: true
  changed_when: false
  failed_when: false
  when: bedrock_existing_profile.rc == 0 or bedrock_missing_sso_vars | length == 0

# `bedrock setup` rewrites the [profile bedrock] section idempotently, so run
# it on every valid session instead of guarding on the section header: header
# presence is no proof the last run's doctor checks passed, and that guard
# would let `make rerun-failed` report success without retrying a failed
# setup. `changed` is derived by diffing the config file before/after.

# Company-private values flow into the config read here and into the setup
# command (the --id value); no_log keeps them and any failure output out of
# logs. Only the return code and the config diff drive behavior.
- name: Read AWS config before setup
  ansible.builtin.slurp:
    path: "{{ lookup('env', 'HOME') }}/.aws/config"
  register: bedrock_config_before
  no_log: true
  changed_when: false
  failed_when: false
  when: (not (bedrock_sso_session.skipped | default(false))) and bedrock_sso_session.rc == 0 and bedrock_setup_id is not none

# Always the full flag set: re-running setup without the original options
# repoints the profile at a nonexistent role and fails the permission-set
# access check (per the team guide).
- name: Run bedrock setup
  ansible.builtin.command:
    argv:
      - "{{ bedrock_install_dir }}/bedrock"
      - setup
      - --id
      - "{{ bedrock_setup_id }}"
      - --region
      - "{{ bedrock_region }}"
      - --source-profile
      - "{{ bedrock_sso_profile_name }}"
      - --yes
  no_log: true
  changed_when: false
  when: (not (bedrock_sso_session.skipped | default(false))) and bedrock_sso_session.rc == 0 and bedrock_setup_id is not none

- name: Read AWS config after setup
  ansible.builtin.slurp:
    path: "{{ lookup('env', 'HOME') }}/.aws/config"
  register: bedrock_config_after
  no_log: true
  failed_when: false
  # The setup command above is this section's only write, and no_log hides
  # its effect, so this after-read carries the change flag for the recap.
  changed_when: bedrock_config_after.content != bedrock_config_before.content
  when: (not (bedrock_sso_session.skipped | default(false))) and bedrock_sso_session.rc == 0 and bedrock_setup_id is not none

- name: Report missing bedrock setup id
  ansible.builtin.debug:
    msg: >-
      bedrock: SSO session is valid but `bedrock setup` was skipped because
      bedrock_setup_id is unset. Set it in group_vars/all/local.yml to the
      --id value from the setup command your admin sent (company-private,
      never commit it), then re-run `make configure TAGS=bedrock`.
  when: (not (bedrock_sso_session.skipped | default(false))) and bedrock_sso_session.rc == 0 and bedrock_setup_id is none

# Expected on first run and after token expiry; the playbook still succeeds.
- name: Report required manual SSO sign-in
  ansible.builtin.debug:
    msg: >-
      bedrock: no valid SSO session for profile '{{ bedrock_sso_profile_name }}'
      (browser sign-in cannot be automated). Run
      `aws sso login --profile {{ bedrock_sso_profile_name }}`, then re-run
      `make configure TAGS=bedrock`: the role will then execute
      `bedrock setup` itself, no manual flags needed. On headless machines
      `aws sso login` prints a URL + code fallback that works from any
      browser.
  when: (not (bedrock_sso_session.skipped | default(false))) and (bedrock_sso_session.rc | default(-1)) != 0

# --- Optional agent integration (opt-in) ----------------------------------------
# Only runs when the matching bedrock_pi_enabled / bedrock_omp_enabled variable
# is true (both accepted as bool or string). Both backends read AWS credentials from the environment
# (AWS_PROFILE/AWS_REGION), so wrapper aliases are the recommended launcher —
# see the role README.

# pi: merge defaultProvider/defaultModel into ~/.pi/agent/settings.json without
# touching any other key. NOTE: when the pi-dotfiles (chezmoi) template manages
# this file, chezmoi wins on the next apply — prefer the template there, or
# re-run this tag afterwards.

- name: Stat pi settings file
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.pi/agent/settings.json"
  register: bedrock_pi_settings_stat
  when: bedrock_pi_enabled | bool

- name: Read pi settings file
  ansible.builtin.slurp:
    path: "{{ lookup('env', 'HOME') }}/.pi/agent/settings.json"
  register: bedrock_pi_settings_raw
  when: bedrock_pi_enabled | bool and bedrock_pi_settings_stat.stat.exists
  changed_when: false

- name: Compute pi settings with Bedrock defaults
  ansible.builtin.set_fact:
    bedrock_pi_settings: >-
      {{ (bedrock_pi_settings_raw.content | b64decode | from_json
          if bedrock_pi_settings_raw.content is defined else {})
         | combine({'defaultProvider': 'amazon-bedrock',
                    'defaultModel': bedrock_claude_model}) }}
  when: bedrock_pi_enabled | bool

- name: Ensure pi agent config directory exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.pi/agent"
    state: directory
    mode: '0755'
  when: bedrock_pi_enabled | bool

- name: Write pi settings with Bedrock defaults
  ansible.builtin.copy:
    dest: "{{ lookup('env', 'HOME') }}/.pi/agent/settings.json"
    content: "{{ bedrock_pi_settings | to_nice_json }}\n"
    mode: "{{ bedrock_pi_settings_stat.stat.mode | default('0644') }}"
  when: bedrock_pi_enabled | bool

# omp: set the default model role via omp's own config command (its config
# store is opaque), skipping when the role already points at Bedrock.

- name: Check omp availability
  ansible.builtin.command:
    argv:
      - omp
      - --version
  register: bedrock_omp_cli
  changed_when: false
  failed_when: false
  when: bedrock_omp_enabled | bool

- name: Read omp model roles
  ansible.builtin.command:
    argv:
      - omp
      - config
      - get
      - modelRoles
      - --json
  register: bedrock_omp_roles_raw
  changed_when: false
  failed_when: false
  when: bedrock_omp_enabled | bool and bedrock_omp_cli.rc == 0

# omp's config set only accepts whole records (no dotted leaf paths), so read
# modelRoles, merge the default role, and write the record back — siblings are
# preserved by construction.
- name: Compute omp model roles with Bedrock default
  ansible.builtin.set_fact:
    bedrock_omp_roles_original: >-
      {{ (bedrock_omp_roles_raw.stdout | from_json).value
         if bedrock_omp_roles_raw.rc == 0 else {} }}
    bedrock_omp_roles: >-
      {{ ((bedrock_omp_roles_raw.stdout | from_json).value
          if bedrock_omp_roles_raw.rc == 0 else {})
         | combine({'default': 'amazon-bedrock/' ~ bedrock_claude_model}) }}
  when: bedrock_omp_enabled | bool and bedrock_omp_cli.rc == 0

- name: Set omp model roles with Bedrock default
  ansible.builtin.command:
    argv:
      - omp
      - config
      - set
      - modelRoles
      - "{{ bedrock_omp_roles | to_json }}"
  changed_when: true
  when: bedrock_omp_enabled | bool and bedrock_omp_cli.rc == 0 and bedrock_omp_roles != bedrock_omp_roles_original

- name: Report missing omp for agent integration
  ansible.builtin.debug:
    msg: >-
      bedrock: bedrock_omp_enabled is true but omp was not found on PATH;
      install it via the ai tag (`make configure TAGS=ai`), then re-run
      `make configure TAGS=bedrock`.
  when: bedrock_omp_enabled | bool and bedrock_omp_cli.rc is defined and bedrock_omp_cli.rc != 0

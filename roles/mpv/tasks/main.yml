- name: Install mpv
  # Same package name in Arch, Debian and Fedora official repos.
  become: true
  ansible.builtin.package:
    name: mpv
    state: present

- name: Push play script
  ansible.builtin.copy:
    src: play.sh
    dest: /usr/local/bin/play
    mode: "0755"
  become: true

- name: Install Vapoursynth
  # Arch-only: Fedora has no vspipe tools package (libs/python only) and the
  # mvtools plugin chain below is AUR-only.
  become: true
  ansible.builtin.package:
    name: vapoursynth
    state: present
  when: ansible_facts["os_family"] == "Archlinux"


- name: Install vapoursynth-plugin-mvtools-git
  become: true
  kewlfft.aur.aur:
    name: vapoursynth-plugin-mvtools-git
    use: auto
    state: present
  become_user: aur_builder
  when: ansible_facts["os_family"] == "Archlinux"
  tags:
    - aur

# vapoursynth-plugin-svpflow stays out: its PKGBUILD expects headers under
# /usr/include/vapoursynth, which VapourSynth 80 no longer ships. Re-add
# when the package adapts.

---
- name: Ensure fonts directory
  ansible.builtin.file:
    path: "/home/{{ user.name }}/.fonts"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ user.name }}"

# Availability is decided by what fontconfig resolves, not by ls-ing
# ~/.fonts: system packages (Arch's base_fonts nerd fonts) satisfy the
# check, and re-downloading would shadow them. Gate on regex over one
# fc-list run — never `failed_when: false` + `is failed`, which can never
# fire (failed_when: false forces .failed to false).
- name: List fonts known to fontconfig
  ansible.builtin.command: fc-list
  register: fc_fonts
  changed_when: false
  become: true
  become_user: "{{ user.name }}"

- name: Download Hack
  when: fc_fonts.stdout is not search('(?i)Hack Nerd Font')
  ansible.builtin.unarchive:
    src: https://github.com/ryanoasis/nerd-fonts/releases/latest/download/Hack.tar.xz
    dest: "/home/{{ user.name }}/.fonts/"
    remote_src: true
  become: true
  become_user: "{{ user.name }}"

- name: Download JetBrains Mono Nerd Font
  when: fc_fonts.stdout is not search('(?i)JetBrainsMono Nerd Font')
  ansible.builtin.unarchive:
    src: https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.tar.xz
    dest: "/home/{{ user.name }}/.fonts/"
    remote_src: true
  become: true
  become_user: "{{ user.name }}"

# Fires only on a pass that downloaded a font above, i.e. exactly when
# something actually changed — keeps converged runs at changed=0.
- name: Rebuild fontconfig cache
  when: >-
    fc_fonts.stdout is not search('(?i)Hack Nerd Font')
    or fc_fonts.stdout is not search('(?i)JetBrainsMono Nerd Font')
  ansible.builtin.command: "fc-cache -f /home/{{ user.name }}/.fonts"
  register: fc_cache_result
  # fc-cache has transient non-zero exits in the wild; retries absorb a
  # blip without masking a persistent failure.
  until: fc_cache_result.rc == 0
  retries: 3
  delay: 5
  changed_when: true
  become: true
  become_user: "{{ user.name }}"

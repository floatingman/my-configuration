---
- name: Install brightnessctl
  become: true
  ansible.builtin.package:
    name: brightnessctl
    state: present

# illuminanced is disabled by default: it continuously rewrites the backlight
# from the ambient light sensor and conflicts with the deterministic brightness
# policy enforced by power_monitor.sh (laptop role). Remove leftovers from
# earlier provisioning runs.
- name: Gather package facts for illuminanced removal
  ansible.builtin.package_facts:
  when: backlight_illuminanced is none

- name: Disable and stop illuminanced
  become: true
  ansible.builtin.service:
    name: illuminanced.service
    enabled: false
    state: stopped
  when:
    - backlight_illuminanced is none
    - "'illuminanced' in ansible_facts.packages"

- name: Remove illuminanced
  become: true
  ansible.builtin.package:
    name: illuminanced
    state: absent
  when: backlight_illuminanced is none

- name: Remove illuminanced configuration
  become: true
  ansible.builtin.file:
    path: /etc/illuminanced.toml
    state: absent
  when: backlight_illuminanced is none

- name: Install illuminanced
  become: true
  ansible.builtin.package:
    name: illuminanced
  when: backlight_illuminanced is not none

- name: Set max backlight file
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/illuminanced.toml
    regexp: ^max_backlight_file
    state: present
    line: 'max_backlight_file = "{{ backlight_illuminanced.max_backlight_file }}"'
  when: backlight_illuminanced.max_backlight_file is defined
  notify:
    - Restart illuminanced

- name: Set backlight file
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/illuminanced.toml
    regexp: ^backlight_file
    state: present
    line: 'backlight_file = "{{ backlight_illuminanced.backlight_file }}"'
  when: backlight_illuminanced.backlight_file is defined
  notify:
    - Restart illuminanced

- name: Set illuminance file
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/illuminanced.toml
    regexp: ^illuminance_file
    state: present
    line: 'illuminance_file = "{{ backlight_illuminanced.illuminance_file }}"'
  when: backlight_illuminanced.illuminance_file is defined
  notify:
    - Restart illuminanced

- name: Set min backlight value
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/illuminanced.toml
    regexp: ^min_backlight
    state: present
    line: "min_backlight = {{ backlight_illuminanced.min_backlight }}"
  when: backlight_illuminanced.min_backlight is defined
  notify:
    - Restart illuminanced

- name: Enable and start illuminanced
  become: true
  ansible.builtin.service:
    name: illuminanced.service
    enabled: true
    state: started
  when: backlight_illuminanced is not none

- name: Install ddcutil
  become: true
  ansible.builtin.package:
    name: ddcutil
    state: present

- name: Install geoclue
  become: true
  ansible.builtin.package:
    name: geoclue
    state: present

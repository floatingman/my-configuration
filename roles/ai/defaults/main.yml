---
# defaults file for ai
# Set to true to enable AI tooling on this machine; null disables it
ai_enabled: null

# Enable/disable individual AI tools
ai_pi_agent_enabled: true
ai_pi_config_enabled: true
ai_rtk_enabled: true

# ForgeCode (AI coding harness)
ai_forgecode_enabled: true
ai_forgecode_zsh_enabled: true

# Oh My Pi (omp — AI coding agent with IDE-grade tooling)
ai_omp_enabled: true

# Local LLM runtime (Ollama + helpers)
ai_local_llm_enabled: true
ai_lmstudio_enabled: true
ai_llmfit_enabled: true

# System-wide binary directory for AI tools
ai_system_bin_dir: /usr/local/bin

---
# Oh My Pi (omp) — AI coding agent (https://omp.sh)
# Install via the official installer script. It honors PI_INSTALL_DIR, so the
# prebuilt native binary (Rust core, no Node/Bun runtime needed) lands directly
# in the system bin dir — no /root intermediate, no world-executable copy (the
# old flow installed under /root because /root is mode 0700 and a symlink from
# /usr/local/bin into /root is unreachable by non-root users). `--binary`
# forces the prebuilt path so a bun appearing on PATH can't redirect the
# install into bun's global dir. The stat guard keeps runs idempotent; the
# installer itself smoke-tests the downloaded binary before reporting success.

- name: Check if omp binary is installed
  ansible.builtin.stat:
    path: "{{ ai_system_bin_dir }}/omp"
  register: ai_omp_stat

- name: Install omp via official installer (into system bin dir)
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://omp.sh/install | sh -s -- --binary
    executable: /bin/bash
  environment:
    PI_INSTALL_DIR: "{{ ai_system_bin_dir }}"
    HOME: /root
    PATH: "/usr/local/bin:/usr/bin:/bin"
  register: ai_omp_install
  changed_when: ai_omp_install.rc == 0
  become: true
  when:
    - ai_omp_enabled | default(true)
    - not ai_omp_stat.stat.exists

# Migration: the previous flow left its source binary under /root/.local/bin.
# The installer's PATH export puts that directory FIRST on root's shell PATH,
# so `sudo omp` would keep running that frozen copy long after the system bin
# dir got a newer one. Remove it so there is exactly one omp on this machine.
- name: Remove stale omp binary from root home (old install flow)
  ansible.builtin.file:
    path: /root/.local/bin/omp
    state: absent
  become: true
  failed_when: false

- name: Verify omp installation
  ansible.builtin.command: "{{ ai_system_bin_dir }}/omp --version"
  register: ai_omp_verify
  changed_when: false
  failed_when: false
  when: ai_omp_enabled | default(true)

- name: Display omp installation status
  ansible.builtin.debug:
    msg: >-
      omp
      {{ 'installed (' ~ (ai_omp_verify.stdout | default('') | trim) ~ ')'
         if (ai_omp_verify.rc | default(1)) == 0
         else 'installation failed or not available' }}
  when: ai_omp_enabled | default(true)

---
# Herdr — terminal session manager for long-running agents (https://herdr.dev)
# Install via the official installer script into the per-user bin dir; herdr's
# installer respects HERDR_INSTALL_DIR, so the binary lands straight in
# {{ ai_user_bin_dir }} (mode 0755) owned by the primary user, and `herdr
# update` installs new versions without sudo. Note: a herdr server still
# running from the old system bin dir keeps targeting it for updates until
# that process restarts, so removing the stale copy below and letting herdr
# relaunch from the user dir is what moves updates off /usr/local/bin. The
# stat guard keeps runs idempotent.

- name: Check if herdr binary is installed
  ansible.builtin.stat:
    path: "{{ ai_user_bin_dir }}/herdr"
  register: ai_herdr_stat

- name: Install herdr via official installer (user bin dir, sudo-free self-updates)
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://herdr.dev/install.sh | sh
    executable: /bin/bash
  environment:
    HERDR_INSTALL_DIR: "{{ ai_user_bin_dir }}"
    HOME: "/home/{{ user.name }}"
    PATH: "{{ ai_user_bin_dir }}:/usr/local/bin:/usr/bin:/bin"
  become: true
  become_user: "{{ user.name }}"
  register: ai_herdr_install
  changed_when: ai_herdr_install.rc == 0
  when:
    - ai_herdr_enabled | default(true)
    - not ai_herdr_stat.stat.exists

- name: Remove stale herdr binary from the system bin dir (old install flow)
  ansible.builtin.file:
    path: "{{ ai_system_bin_dir }}/herdr"
    state: absent
  become: true
  failed_when: false

- name: Verify herdr installation
  ansible.builtin.command: "{{ ai_user_bin_dir }}/herdr --version"
  environment:
    HOME: "/home/{{ user.name }}"
  become: true
  become_user: "{{ user.name }}"
  register: ai_herdr_verify
  changed_when: false
  failed_when: false
  when: ai_herdr_enabled | default(true)

- name: Display herdr installation status
  ansible.builtin.debug:
    msg: >-
      herdr
      {{ 'installed (' ~ (ai_herdr_verify.stdout | default('') | trim) ~ ')'
         if (ai_herdr_verify.rc | default(1)) == 0
         else 'installation failed or not available' }}
  when: ai_herdr_enabled | default(true)

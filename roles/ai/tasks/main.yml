---
# tasks file for ai
# AI tool install locations:
# - pi-agent installs per-user via npm into ~/.local (user npm prefix) so its
#   built-in updater (`pi update`) needs no sudo; the pi section also removes
#   superseded system-wide copies from the earlier flow.
# - ForgeCode installs system-wide into {{ ai_system_bin_dir }} — it does not
#   rewrite its own binary.
# - omp and herdr self-update by rewriting the binary they resolve to on
#   PATH, so they install per-user into {{ ai_user_bin_dir }}: `omp update` /
#   `herdr update` then need no sudo (see omp.yml / herdr.yml, which also
#   remove the stale system-wide copies from the previous flow).
# Per-user config (~/.pi/, ~/.forge/, ~/.omp/) remains in each user's home.


- name: Check if Homebrew is available
  ansible.builtin.stat:
    path: /home/linuxbrew/.linuxbrew/bin/brew
  register: ai_homebrew_stat

- name: Set Homebrew availability fact
  ansible.builtin.set_fact:
    ai_homebrew_available: "{{ ai_homebrew_stat.stat.exists }}"

# ai_user_bin_dir is chowned to the primary user below; if a machine-local
# override pointed it at a system directory (e.g. /usr/local/bin), that
# chown would hand the directory to the user. Fail the play before that.
- name: Assert ai_user_bin_dir is under the primary user's home
  ansible.builtin.assert:
    that:
      - ai_user_bin_dir is search("/home/{{ user.name }}/")
    fail_msg: "ai_user_bin_dir must be inside /home/{{ user.name }}; refusing to chown a system directory."

# Per-user install dir for the self-updating tools (pi, omp, herdr — see
# header). Runs as root (no become_user) so a pre-existing root-owned
# directory gets chowned to the primary user; the become_user'd installers
# below need the dir user-writable or every self-update would still require
# sudo.

- name: Ensure user bin dir exists and is owned by the primary user
  ansible.builtin.file:
    path: "{{ ai_user_bin_dir }}"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.group | default(user.name) }}"
    mode: "0755"
  become: true

- name: Include ForgeCode tasks
  ansible.builtin.include_tasks: forgecode.yml

- name: Include omp tasks
  ansible.builtin.include_tasks: omp.yml

- name: Include herdr tasks
  ansible.builtin.include_tasks: herdr.yml

# asdf 0.16+ (Go) ships BOTH the Go binary (/opt/asdf/asdf) and a legacy bash
# wrapper (/opt/asdf/bin/asdf) that prints the "upgrade to 0.16" migration
# notice on EVERY invocation. The shims under /opt/asdf/shims exec bin/asdf, so
# without this every node/npm/... call prints the notice and runs through the
# legacy bash path. Point bin/asdf at the Go binary so shims use it: no notice,
# and the (working) Go exec path. asdf 0.18 writes fresh shims as
# `exec asdf exec ...` (bare asdf on PATH -> /usr/local/bin/asdf -> Go), so this
# also keeps those correct. The asdf role re-clones the repo each run (restoring
# the legacy bin/asdf), so this must run after asdf and is idempotent.
- name: Point asdf bin/asdf at the Go binary (silence legacy migration notice)
  ansible.builtin.file:
    src: /opt/asdf/asdf
    dest: /opt/asdf/bin/asdf
    state: link
    force: true
    owner: root
    group: devtools
  become: true

# -------------------------------------------------------------------------
# pi-agent (npm — per-user install for sudo-free self-updates)
# -------------------------------------------------------------------------
# pi is installed into the user's npm prefix (~/.local) and owns its own
# updater (`pi update`, used by the user's update-all zsh function), which
# shells out to `npm install -g`. Root never touches the pi tree, so updates
# need no sudo and no group-write grants on the asdf node install (an earlier
# system-wide flow made parts of that tree devtools-writable so root-run
# npm/pi could be trojaned by a group member — reverted here).
#
# History note: a per-user pi was removed in the past because ~/.local/bin/pi
# shadowed the asdf shim and ran under the system Node (v18) on machines
# without a pinned asdf nodejs. That is addressed by keeping nodejs pinned in
# asdf_plugins (base.yml) — `env node` then resolves to the asdf-managed Node
# via /etc/profile.d/asdf.sh on every machine this role runs on — and by this
# section removing any superseded system-wide pi copies, so ~/.local/bin/pi is
# the single pi entrypoint.
- name: Point user npm global prefix at ~/.local (keeps pi update sudo-free)
  ansible.builtin.lineinfile:
    path: "/home/{{ user.name }}/.npmrc"
    line: "prefix={{ ai_user_bin_dir | dirname }}"
    state: present
    create: true
    # 0600: npm config files commonly hold private-registry _authToken
    # entries; keep the file owner-only regardless of prior mode.
    mode: "0600"
    owner: "{{ user.name }}"
    group: "{{ user.group | default(user.name) }}"
  become: true
  when: ai_pi_agent_enabled | default(true)

- name: Install pi-agent per-user via npm
  ansible.builtin.command:
    cmd: npm install -g @earendil-works/pi-coding-agent
  environment:
    PATH: "/opt/asdf/bin:/opt/asdf/shims:{{ ai_user_bin_dir }}:{{ ansible_facts['env']['PATH'] }}"
    ASDF_DIR: "/opt/asdf"
    ASDF_DATA_DIR: "/opt/asdf"
    HOME: "/home/{{ user.name }}"
    NPM_CONFIG_PREFIX: "{{ ai_user_bin_dir | dirname }}"
  become: true
  become_user: "{{ user.name }}"
  when: ai_pi_agent_enabled | default(true)
  register: ai_pi_agent_result
  changed_when: ai_pi_agent_result.rc == 0
  failed_when: false

# Clean cutover from the earlier system-wide flow: machines that ran it have
# a root-owned pi under the asdf node tree, a configured-bin-dir symlink, a
# legacy asdf shim, and (from one revision of this role) group-write grants on
# the node tree. Remove all of them so ~/.local/bin/pi is the only pi entry
# point, and revoke the group write/setgid bits so the asdf tree returns to
# admin-managed root-only modes.
#
# Ordering matters on machines where the grants are still live: group write is
# revoked across the tree BEFORE any removal, so a devtools member cannot swap
# an intermediate component (e.g. plant lib/node_modules/@earendil-works as a
# symlink) while root is deleting through it. Removals then verify each parent
# is a real directory rather than resolving through a pre-planted symlink. The
# recursive revoke is a one-time migration: it is skipped once the tree no
# longer holds any group-writable entry, so steady-state runs don't walk it.
- name: Remove superseded system-wide pi install and access grants
  ansible.builtin.shell: |
    set -e
    shopt -s nullglob
    rm -f "{{ ai_system_bin_dir | default('/usr/local/bin') }}/pi"
    rm -f /opt/asdf/shims/pi
    if [ -d /opt/asdf/installs/nodejs ]; then
      if [ -n "$(find /opt/asdf/installs/nodejs -perm -g+w ! -type l -print -quit 2>/dev/null)" ]; then
        chown -R root:devtools /opt/asdf/installs/nodejs
        chmod -R g-ws /opt/asdf/installs/nodejs
      fi
      for v in /opt/asdf/installs/nodejs/*/; do
        [ -d "$v" ] && [ ! -L "$v" ] || continue
        vd="${v%/}"
        lib="${vd}/lib"
        nm="${lib}/node_modules"
        scope="${nm}/@earendil-works"
        if [ -L "$lib" ] || [ -L "$nm" ] || [ -L "$scope" ]; then
          # A planted link anywhere on the path: remove the links themselves
          # and never let rm traverse through them.
          [ -L "$lib" ] && rm -f "$lib"
          [ -L "$nm" ] && rm -f "$nm"
          [ -L "$scope" ] && rm -f "$scope"
          continue
        fi
        if [ -d "$scope" ]; then
          rm -rf "${scope}/pi-coding-agent"
          rmdir "$scope" 2>/dev/null || true
        fi
        if [ -d "${vd}/bin" ] && [ ! -L "${vd}/bin" ]; then
          rm -f "${vd}/bin/pi"
        fi
      done
    fi
  args:
    executable: /bin/bash
  become: true
  changed_when: false
  when:
    - ai_pi_agent_enabled | default(true)
    # Keep the superseded system-wide copies until the per-user install has
    # actually succeeded, so a failed install never leaves the machine
    # without a working pi.
    - ai_pi_agent_result.rc | default(1) == 0

# One-time migration outside the pi flow: an older gcloud install left the
# /opt/asdf/installs/gcloud tree root:devtools mode 775, so any devtools
# member could rewrite binaries that every user executes. Revoke group write
# and setgid, same probe style as the pi cleanup above (the ! -type l guard
# keeps the find from matching symlinks, which are always mode 0777). Once no
# group-writable entry remains this is a no-op, so steady-state plays skip
# the recursive chown/chmod entirely. `gcloud components update` must now run
# as root — that is the intended tradeoff.
- name: Remove group-write from gcloud install tree (one-time migration)
  ansible.builtin.shell: |
    set -e
    if [ -d /opt/asdf/installs/gcloud ]; then
      if [ -n "$(find /opt/asdf/installs/gcloud -perm -g+w ! -type l -print -quit 2>/dev/null)" ]; then
        chown -R root:root /opt/asdf/installs/gcloud
        chmod -R g-ws /opt/asdf/installs/gcloud
      fi
    fi
  args:
    executable: /bin/bash
  become: true
  changed_when: false

# asdf 0.16+ (Go rewrite) removed the static completion files (completions are
# now dynamic via `asdf completion`). Older dotfiles source
# $ASDF_DIR/completions/asdf.bash, which no longer exists, causing a
# "no such file or directory" error on every zsh startup. Generate the legacy
# files so those dotfiles keep working. Delete the file to force regeneration
# after an asdf upgrade.
- name: Generate legacy asdf completion files for older dotfiles
  ansible.builtin.shell: |
    set -e
    install -d -m 0755 /opt/asdf/completions
    /opt/asdf/asdf completion bash > /opt/asdf/completions/asdf.bash
    /opt/asdf/asdf completion zsh > /opt/asdf/completions/asdf.zsh
    chmod 0644 /opt/asdf/completions/asdf.bash /opt/asdf/completions/asdf.zsh
  args:
    creates: /opt/asdf/completions/asdf.bash
  become: true

# Run the verification as the primary user against the per-user install.
- name: Verify pi-agent installation
  ansible.builtin.command: "{{ ai_user_bin_dir }}/pi --version"
  environment:
    PATH: "/opt/asdf/bin:/opt/asdf/shims:{{ ai_user_bin_dir }}:{{ ansible_facts['env']['PATH'] }}"
    ASDF_DIR: "/opt/asdf"
    ASDF_DATA_DIR: "/opt/asdf"
    HOME: "/home/{{ user.name }}"
  become: true
  become_user: "{{ user.name }}"
  register: ai_pi_agent_verify
  changed_when: false
  failed_when: false
  when: ai_pi_agent_enabled | default(true)

- name: Display pi-agent installation status
  ansible.builtin.debug:
    msg: >-
      pi-agent
      {{ 'installed (' ~ (ai_pi_agent_verify.stdout | default('') | trim) ~ ')'
         if (ai_pi_agent_verify.rc | default(1)) == 0
         else 'installation failed or not available' }}
  when: ai_pi_agent_enabled | default(true)

# `become_user` resets PATH to a minimal secure path that does NOT include
# /home/linuxbrew/.linuxbrew/bin (where chezmoi lives on Debian), so add it.
- name: Apply pi configuration from chezmoi
  ansible.builtin.command: >
    chezmoi apply --force ~/.pi
  environment:
    HOME: "/home/{{ user.name }}"
    PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts['env']['PATH'] }}"
  register: ai_chezmoi_pi_result
  changed_when: ai_chezmoi_pi_result.rc == 0
  failed_when: false
  become: true
  become_user: "{{ user.name }}"
  when:
    - ai_pi_agent_enabled | default(true)
    - ai_pi_config_enabled | default(true)

# -------------------------------------------------------------------------
# rtk (Rust tool - prefer Homebrew, fallback to AUR/cargo)
#
# Homebrew refuses to run as root ("extremely dangerous and no longer
# supported"), so taps/installs MUST run as an unprivileged user. The
# linuxbrew tree (/home/linuxbrew/.linuxbrew) was installed root-owned, which
# blocks every non-root user. We transfer ownership to the primary user
# (keeping the linuxbrew group + group-writable setgid bits so other members
# retain access) as a one-time migration guarded by a stat check, then run
# brew as that user. Owning the tree directly sidesteps the supplementary-
# group session timing issue that affects `become_user`.
# -------------------------------------------------------------------------
- name: Detect linuxbrew tree ownership
  ansible.builtin.stat:
    path: /home/linuxbrew/.linuxbrew
  register: ai_linuxbrew_tree_stat
  when:
    - ai_rtk_enabled | default(true)
    - ai_homebrew_available

- name: Ensure linuxbrew group exists
  ansible.builtin.group:
    name: linuxbrew
    state: present
  become: true
  when:
    - ai_rtk_enabled | default(true)
    - ai_homebrew_available

- name: Add primary user to the linuxbrew group
  ansible.builtin.user:
    name: "{{ user.name }}"
    groups: linuxbrew
    append: true
  become: true
  when:
    - ai_rtk_enabled | default(true)
    - ai_homebrew_available

# One-time migration: transfer the tree to the primary user (group linuxbrew,
# group-writable, setgid) so brew can run as that user while staying usable
# by other linuxbrew members. Skipped once the primary user already owns it.
- name: Transfer linuxbrew tree to primary user (multi-user, one-time)
  ansible.builtin.shell:
    cmd: >
      chown -R {{ user.name }}:linuxbrew /home/linuxbrew/.linuxbrew &&
      chmod -R g+rwX /home/linuxbrew/.linuxbrew &&
      find /home/linuxbrew/.linuxbrew -type d -exec chmod g+s {} +
    executable: /bin/bash
  become: true
  changed_when: false
  when:
    - ai_rtk_enabled | default(true)
    - ai_homebrew_available
    - ai_linuxbrew_tree_stat.stat.pw_name != user.name

# Homebrew expands tap `<user>/<name>` to repo `<user>/homebrew-<name>`.
# The repo is rtk-ai/homebrew-tap (public), so the tap name is rtk-ai/tap.
- name: Tap rtk-ai/tap
  community.general.homebrew_tap:
    name: rtk-ai/tap
    state: present
    path: /home/linuxbrew/.linuxbrew/bin
  become: true
  become_user: "{{ user.name }}"
  environment:
    HOME: "/home/{{ user.name }}"
  when:
    - ai_rtk_enabled | default(true)
    - ai_homebrew_available

- name: Install rtk via Homebrew
  community.general.homebrew:
    name: rtk-ai/tap/rtk
    state: present
    path: /home/linuxbrew/.linuxbrew/bin
  become: true
  become_user: "{{ user.name }}"
  environment:
    HOME: "/home/{{ user.name }}"
    # Homebrew sandboxes builds with bubblewrap, whose user namespace maps only
    # the caller's primary gid. The multi-user linuxbrew group (gid != primary)
    # is unmapped there, so the staging dir's group chown fails with
    # Errno::EINVAL and the install aborts. Disable the sandbox (the supported
    # escape hatch) so the brew group resolves and non-bottle formulae install.
    HOMEBREW_NO_SANDBOX_LINUX: "1"
  ignore_errors: true
  register: ai_rtk_homebrew_result
  when:
    - ai_rtk_enabled | default(true)
    - ai_homebrew_available

- name: Install rtk-bin via AUR (Arch Linux only)
  kewlfft.aur.aur:
    name: rtk-bin
    state: present
  when:
    - ai_rtk_enabled | default(true)
    - ansible_facts['os_family'] == 'Archlinux'
    - not ai_homebrew_available or ai_rtk_homebrew_result is failed
  register: ai_rtk_aur_result
  failed_when: false

# -------------------------------------------------------------------------
# Local LLM runtime (Ollama + helpers)
# -------------------------------------------------------------------------
- name: Install Ollama and GPU acceleration backends
  become: true
  ansible.builtin.package:
    name:
      - ollama
      - ollama-rocm
      - ollama-vulkan
      - llm-manager
    state: present
  when:
    - ai_local_llm_enabled | default(true)
    - ansible_facts['os_family'] == "Archlinux"

- name: Install LM Studio from AUR
  become: true
  become_user: aur_builder
  kewlfft.aur.aur:
    name: lmstudio-bin
    use: auto
    state: present
  when:
    - ai_lmstudio_enabled | default(true)
    - ansible_facts['os_family'] == "Archlinux"
  tags:
    - aur

- name: Install llmfit
  become: true
  become_user: aur_builder
  ansible.builtin.package:
    name: llmfit
    state: present
  when:
    - ai_llmfit_enabled | default(true)
    - ansible_facts['os_family'] == "Archlinux"

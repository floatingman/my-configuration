---
# tasks file for ai
# AI tools (pi, forge) are installed system-wide so all users on the machine
# can access them.
# - pi-agent is installed via npm under the system-wide asdf-managed Node, so
#   the `pi` binary is exposed through the asdf shims (/etc/profile.d/asdf.sh).
# - ForgeCode is symlinked into /usr/local/bin.
# Per-user config (~/.pi/, ~/.forge/) remains in each user's home.

- name: Check if Homebrew is available
  ansible.builtin.stat:
    path: /home/linuxbrew/.linuxbrew/bin/brew
  register: ai_homebrew_stat

- name: Set Homebrew availability fact
  ansible.builtin.set_fact:
    ai_homebrew_available: "{{ ai_homebrew_stat.stat.exists }}"

- name: Include ForgeCode tasks
  ansible.builtin.include_tasks: forgecode.yml

# asdf 0.16+ (Go) ships BOTH the Go binary (/opt/asdf/asdf) and a legacy bash
# wrapper (/opt/asdf/bin/asdf) that prints the "upgrade to 0.16" migration
# notice on EVERY invocation. The shims under /opt/asdf/shims exec bin/asdf, so
# without this every node/npm/... call prints the notice and runs through the
# legacy bash path. Point bin/asdf at the Go binary so shims use it: no notice,
# and the (working) Go exec path. asdf 0.18 writes fresh shims as
# `exec asdf exec ...` (bare asdf on PATH -> /usr/local/bin/asdf -> Go), so this
# also keeps those correct. The asdf role re-clones the repo each run (restoring
# the legacy bin/asdf), so this must run after asdf and is idempotent.
- name: Point asdf bin/asdf at the Go binary (silence legacy migration notice)
  ansible.builtin.file:
    src: /opt/asdf/asdf
    dest: /opt/asdf/bin/asdf
    state: link
    force: true
    owner: root
    group: devtools
  become: true

# -------------------------------------------------------------------------
# pi-agent (npm — system-wide via asdf-managed Node)
# -------------------------------------------------------------------------
# Remove the stale per-user pi install from ~/.local. pi used to be installed
# manually there; with it present, ~/.local/bin/pi (shebang #!/usr/bin/env
# node) can resolve ahead of the asdf shim and run under the system Node
# (e.g. v18.19.1), which is too old for pi's `import ... with { type: "json" }`
# import attributes. Removing it ensures the asdf-managed pi (Node 25) is used.
- name: Remove stale per-user pi install from ~/.local
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  become_user: "{{ user.name }}"
  loop:
    - "/home/{{ user.name }}/.local/bin/pi"
    - "/home/{{ user.name }}/.local/lib/node_modules/@earendil-works/pi-coding-agent"
  when: ai_pi_agent_enabled | default(true)
  failed_when: false

# Run as root because:
#   1. The asdf nodejs install dir (/opt/asdf/installs/nodejs) is root:devtools.
#      The primary user is added to `devtools` by the asdf/system role, but group
#      membership only takes effect on the NEXT login — the running ansible
#      process doesn't have it yet, so a non-root install fails with EACCES.
#   2. The `npm` shim is `exec asdf exec "npm" "$@"`, which needs ASDF_DIR /
#      ASDF_DATA_DIR to locate the /opt/asdf data dir; without them asdf looks in
#      the default ~/.asdf and the shim fails (rc=126). sudo's env_reset wipes
#      inherited vars, so we set them explicitly here.
- name: Install pi-agent via npm (system-wide)
  ansible.builtin.command:
    cmd: npm install -g --unsafe-perm @earendil-works/pi-coding-agent
  environment:
    PATH: "/opt/asdf/bin:/opt/asdf/shims:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
    ASDF_DIR: "/opt/asdf"
    ASDF_DATA_DIR: "/opt/asdf"
  become: true
  when: ai_pi_agent_enabled | default(true)
  register: ai_pi_agent_result
  changed_when: ai_pi_agent_result.rc == 0
  failed_when: false

- name: Reshim asdf nodejs (keeps node/npm shims current)
  ansible.builtin.command:
    cmd: asdf reshim nodejs
  environment:
    PATH: "/opt/asdf/bin:/opt/asdf/shims:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
    ASDF_DIR: "/opt/asdf"
    ASDF_DATA_DIR: "/opt/asdf"
  become: true
  when: ai_pi_agent_enabled | default(true)
  changed_when: false
  failed_when: false

# asdf 0.16+ (Go rewrite) only shims the executables a plugin DECLARES
# (node, npm, npx, ...) — NOT arbitrary npm-global binaries like `pi`. The old
# bash asdf shimmed everything in bin/, so the asdf-shim approach for pi broke
# under 0.18 ("unknown command: pi. Perhaps you have to reshim?"). Expose pi via
# a stable symlink in /usr/local/bin instead. Its #!/usr/bin/env node shebang
# resolves to the asdf node shim on PATH, so it runs under the managed Node.
# This mirrors how ForgeCode is symlinked below.
- name: Locate the asdf-installed pi binary
  ansible.builtin.shell: "ls /opt/asdf/installs/nodejs/*/bin/pi 2>/dev/null | sort -V | tail -1"
  register: ai_pi_asdf_binary
  changed_when: false
  failed_when: false
  when: ai_pi_agent_enabled | default(true)

- name: Symlink pi into /usr/local/bin
  ansible.builtin.file:
    src: "{{ ai_pi_asdf_binary.stdout }}"
    dest: "{{ ai_system_bin_dir | default('/usr/local/bin') }}/pi"
    state: link
    force: true
    owner: root
    group: root
  become: true
  when:
    - ai_pi_agent_enabled | default(true)
    - ai_pi_asdf_binary.stdout | default('') | length > 0
  failed_when: false

# asdf 0.16+ (Go rewrite) removed the static completion files (completions are
# now dynamic via `asdf completion`). Older dotfiles source
# $ASDF_DIR/completions/asdf.bash, which no longer exists, causing a
# "no such file or directory" error on every zsh startup. Generate the legacy
# files so those dotfiles keep working. Delete the file to force regeneration
# after an asdf upgrade.
- name: Generate legacy asdf completion files for older dotfiles
  ansible.builtin.shell: |
    set -e
    install -d -m 0755 /opt/asdf/completions
    /opt/asdf/asdf completion bash > /opt/asdf/completions/asdf.bash
    /opt/asdf/asdf completion zsh > /opt/asdf/completions/asdf.zsh
    chmod 0644 /opt/asdf/completions/asdf.bash /opt/asdf/completions/asdf.zsh
  args:
    creates: /opt/asdf/completions/asdf.bash
  become: true

- name: Verify pi-agent installation
  ansible.builtin.command: "{{ ai_system_bin_dir | default('/usr/local/bin') }}/pi --version"
  environment:
    PATH: "/opt/asdf/bin:/opt/asdf/shims:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
    ASDF_DIR: "/opt/asdf"
    ASDF_DATA_DIR: "/opt/asdf"
  become: true
  register: ai_pi_agent_verify
  changed_when: false
  failed_when: false
  when: ai_pi_agent_enabled | default(true)

- name: Display pi-agent installation status
  ansible.builtin.debug:
    msg: >-
      pi-agent
      {{ 'installed (' ~ (ai_pi_agent_verify.stdout | default('') | trim) ~ ')'
         if (ai_pi_agent_verify.rc | default(1)) == 0
         else 'installation failed or not available' }}
  when: ai_pi_agent_enabled | default(true)

# `become_user` resets PATH to a minimal secure path that does NOT include
# /home/linuxbrew/.linuxbrew/bin (where chezmoi lives on Debian), so add it.
- name: Apply pi configuration from chezmoi
  ansible.builtin.command: >
    chezmoi apply --force ~/.pi
  environment:
    HOME: "/home/{{ user.name }}"
    PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts['env']['PATH'] }}"
  register: ai_chezmoi_pi_result
  changed_when: ai_chezmoi_pi_result.rc == 0
  failed_when: false
  become: true
  become_user: "{{ user.name }}"
  when:
    - ai_pi_agent_enabled | default(true)
    - ai_pi_config_enabled | default(true)

# -------------------------------------------------------------------------
# rtk (Rust tool - prefer Homebrew, fallback to AUR/cargo)
#
# Homebrew refuses to run as root ("extremely dangerous and no longer
# supported"), so taps/installs MUST run as an unprivileged user. The
# linuxbrew tree (/home/linuxbrew/.linuxbrew) was installed root-owned, which
# blocks every non-root user. We transfer ownership to the primary user
# (keeping the linuxbrew group + group-writable setgid bits so other members
# retain access) as a one-time migration guarded by a stat check, then run
# brew as that user. Owning the tree directly sidesteps the supplementary-
# group session timing issue that affects `become_user`.
# -------------------------------------------------------------------------
- name: Detect linuxbrew tree ownership
  ansible.builtin.stat:
    path: /home/linuxbrew/.linuxbrew
  register: ai_linuxbrew_tree_stat
  when:
    - ai_rtk_enabled | default(true)
    - ai_homebrew_available

- name: Ensure linuxbrew group exists
  ansible.builtin.group:
    name: linuxbrew
    state: present
  become: true
  when:
    - ai_rtk_enabled | default(true)
    - ai_homebrew_available

- name: Add primary user to the linuxbrew group
  ansible.builtin.user:
    name: "{{ user.name }}"
    groups: linuxbrew
    append: true
  become: true
  when:
    - ai_rtk_enabled | default(true)
    - ai_homebrew_available

# One-time migration: transfer the tree to the primary user (group linuxbrew,
# group-writable, setgid) so brew can run as that user while staying usable
# by other linuxbrew members. Skipped once the primary user already owns it.
- name: Transfer linuxbrew tree to primary user (multi-user, one-time)
  ansible.builtin.shell:
    cmd: >
      chown -R {{ user.name }}:linuxbrew /home/linuxbrew/.linuxbrew &&
      chmod -R g+rwX /home/linuxbrew/.linuxbrew &&
      find /home/linuxbrew/.linuxbrew -type d -exec chmod g+s {} +
    executable: /bin/bash
  become: true
  changed_when: false
  when:
    - ai_rtk_enabled | default(true)
    - ai_homebrew_available
    - ai_linuxbrew_tree_stat.stat.pw_name != user.name

# Homebrew expands tap `<user>/<name>` to repo `<user>/homebrew-<name>`.
# The repo is rtk-ai/homebrew-tap (public), so the tap name is rtk-ai/tap.
- name: Tap rtk-ai/tap
  community.general.homebrew_tap:
    name: rtk-ai/tap
    state: present
    path: /home/linuxbrew/.linuxbrew/bin
  become: true
  become_user: "{{ user.name }}"
  environment:
    HOME: "/home/{{ user.name }}"
  when:
    - ai_rtk_enabled | default(true)
    - ai_homebrew_available

- name: Install rtk via Homebrew
  community.general.homebrew:
    name: rtk-ai/tap/rtk
    state: present
    path: /home/linuxbrew/.linuxbrew/bin
  become: true
  become_user: "{{ user.name }}"
  environment:
    HOME: "/home/{{ user.name }}"
    # Homebrew sandboxes builds with bubblewrap, whose user namespace maps only
    # the caller's primary gid. The multi-user linuxbrew group (gid != primary)
    # is unmapped there, so the staging dir's group chown fails with
    # Errno::EINVAL and the install aborts. Disable the sandbox (the supported
    # escape hatch) so the brew group resolves and non-bottle formulae install.
    HOMEBREW_NO_SANDBOX_LINUX: "1"
  ignore_errors: true
  register: ai_rtk_homebrew_result
  when:
    - ai_rtk_enabled | default(true)
    - ai_homebrew_available

- name: Install rtk-bin via AUR (Arch Linux only)
  kewlfft.aur.aur:
    name: rtk-bin
    state: present
  when:
    - ai_rtk_enabled | default(true)
    - ansible_facts['os_family'] == 'Archlinux'
    - not ai_homebrew_available or ai_rtk_homebrew_result is failed
  register: ai_rtk_aur_result
  failed_when: false

# -------------------------------------------------------------------------
# Local LLM runtime (Ollama + helpers)
# -------------------------------------------------------------------------
- name: Install Ollama and GPU acceleration backends
  become: true
  ansible.builtin.package:
    name:
      - ollama
      - ollama-rocm
      - ollama-vulkan
      - llm-manager
    state: present
  when:
    - ai_local_llm_enabled | default(true)
    - ansible_facts['os_family'] == "Archlinux"

- name: Install LM Studio from AUR
  become: true
  become_user: aur_builder
  kewlfft.aur.aur:
    name: lmstudio-bin
    use: auto
    state: present
  when:
    - ai_lmstudio_enabled | default(true)
    - ansible_facts['os_family'] == "Archlinux"
  tags:
    - aur

- name: Install llmfit from AUR
  become: true
  become_user: aur_builder
  kewlfft.aur.aur:
    name: llmfit-bin
    use: auto
    state: present
  when:
    - ai_llmfit_enabled | default(true)
    - ansible_facts['os_family'] == "Archlinux"
  tags:
    - aur

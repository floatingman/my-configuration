---
# ForgeCode — AI coding harness (https://forgecode.dev)
# Install via official installer script to /usr/local/bin for system-wide access.
# ZSH plugin setup remains per-user.

- name: Check if ForgeCode is already installed
  ansible.builtin.stat:
    path: "{{ ai_system_bin_dir }}/forge"
  register: ai_forgecode_stat

- name: Install ForgeCode via official installer (system-wide)
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://forgecode.dev/cli | sh
  environment:
    HOME: /root
    PATH: "/usr/local/bin:/usr/bin:/bin"
  register: ai_forgecode_install
  changed_when: ai_forgecode_install.rc == 0
  become: true
  when:
    - ai_forgecode_enabled | default(true)
    - not ai_forgecode_stat.stat.exists

- name: Symlink forge to system bin dir
  ansible.builtin.file:
    src: /root/.local/bin/forge
    dest: "{{ ai_system_bin_dir }}/forge"
    state: link
    force: true
  become: true
  when:
    - ai_forgecode_enabled | default(true)

- name: Verify ForgeCode installation
  ansible.builtin.command: "{{ ai_system_bin_dir }}/forge --help"
  register: ai_forgecode_verify
  changed_when: false
  failed_when: false
  when: ai_forgecode_enabled | default(true)

# -------------------------------------------------------------------------
# ZSH Plugin Integration (per-user)
#
# We deliberately do NOT use `forge zsh setup` here:
#   - it accepts no flags (an earlier `--yes` was rejected silently), and
#   - it edits ~/.zshrc directly, which is chezmoi-managed and would be wiped
#     by the next `chezmoi apply`.
# Instead we generate the plugin/theme scripts into ~/.forge/zsh/ (forge's own
# directory, not managed by chezmoi) and source them from ~/.zshrc via an
# idempotent block. The ai role runs after the dotfiles role, so the block is
# re-added cleanly on every playbook run even if chezmoi rewrites ~/.zshrc.
# -------------------------------------------------------------------------
- name: Ensure ForgeCode zsh script directory exists
  ansible.builtin.file:
    path: "/home/{{ user.name }}/.forge/zsh"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: '0755'
  become: true
  when:
    - ai_forgecode_enabled | default(true)
    - ai_forgecode_zsh_enabled | default(true)

- name: Generate ForgeCode zsh plugin script
  ansible.builtin.command: forge zsh plugin
  environment:
    HOME: "/home/{{ user.name }}"
    PATH: "{{ ai_system_bin_dir }}:{{ ansible_facts['env']['PATH'] }}"
  register: ai_forgecode_plugin_out
  changed_when: false
  become: true
  become_user: "{{ user.name }}"
  when:
    - ai_forgecode_enabled | default(true)
    - ai_forgecode_zsh_enabled | default(true)

- name: Write ForgeCode zsh plugin script
  ansible.builtin.copy:
    dest: "/home/{{ user.name }}/.forge/zsh/forge.plugin.zsh"
    content: "{{ ai_forgecode_plugin_out.stdout }}"
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: '0644'
  become: true
  when:
    - ai_forgecode_enabled | default(true)
    - ai_forgecode_zsh_enabled | default(true)

- name: Generate ForgeCode zsh theme script
  ansible.builtin.command: forge zsh theme
  environment:
    HOME: "/home/{{ user.name }}"
    PATH: "{{ ai_system_bin_dir }}:{{ ansible_facts['env']['PATH'] }}"
  register: ai_forgecode_theme_out
  changed_when: false
  become: true
  become_user: "{{ user.name }}"
  when:
    - ai_forgecode_enabled | default(true)
    - ai_forgecode_zsh_enabled | default(true)

- name: Write ForgeCode zsh theme script
  ansible.builtin.copy:
    dest: "/home/{{ user.name }}/.forge/zsh/forge.theme.zsh"
    content: "{{ ai_forgecode_theme_out.stdout }}"
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: '0644'
  become: true
  when:
    - ai_forgecode_enabled | default(true)
    - ai_forgecode_zsh_enabled | default(true)

- name: Source ForgeCode zsh integration from .zshrc
  ansible.builtin.blockinfile:
    path: "/home/{{ user.name }}/.zshrc"
    create: true
    marker: "# {mark} ANSIBLE MANAGED BLOCK: forgecode zsh integration"
    block: |
      # ForgeCode zsh integration (plugin + theme)
      if command -v forge >/dev/null 2>&1; then
        [ -f "$HOME/.forge/zsh/forge.plugin.zsh" ] && source "$HOME/.forge/zsh/forge.plugin.zsh"
        [ -f "$HOME/.forge/zsh/forge.theme.zsh" ] && source "$HOME/.forge/zsh/forge.theme.zsh"
      fi
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: '0644'
  become: true
  become_user: "{{ user.name }}"
  when:
    - ai_forgecode_enabled | default(true)
    - ai_forgecode_zsh_enabled | default(true)

- name: Display ForgeCode installation status
  ansible.builtin.debug:
    msg: >-
      ForgeCode {{ 'installed' if (ai_forgecode_verify.rc | default(1)) == 0 else 'installation failed or not available' }}
      {{ 'with ZSH plugin sourced from ~/.zshrc' if (ai_forgecode_zsh_enabled | default(true)) else '' }}
  when: ai_forgecode_enabled | default(true)

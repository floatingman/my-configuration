---
# ForgeCode — AI coding harness (https://forgecode.dev)
# The installer hardcodes $HOME/.local/bin on Linux (its PREFIX override is
# Android-only), so it cannot target the system bin dir directly. Instead we
# run it with a throwaway HOME: the forge binary, its fzf/bat/fd dependency
# downloads, and its rc-file PATH edits all land under the temp dir, and we
# `install` the binary out of there into the system bin dir as a real,
# world-executable file.
#
# The old flow ran the installer with HOME=/root and copied the binary out of
# /root/.local/bin. That littered /root/.local/bin with frozen fzf/bat/fd
# copies (unreachable by non-root users) and prepended PATH exports to
# /root/.bashrc and /root/.zshrc. The throwaway-HOME flow leaves nothing
# behind anywhere.
#
# ZSH plugin setup remains per-user.

- name: Check if forge binary is installed
  ansible.builtin.stat:
    path: "{{ ai_system_bin_dir }}/forge"
  register: ai_forgecode_stat

# `install` would write through a leftover symlink from the very first
# install approach, so keep removing those once before the binary task runs.
- name: Check for stale forge entry in system bin dir
  ansible.builtin.stat:
    path: "{{ ai_system_bin_dir }}/forge"
    follow: false
  register: ai_forgecode_link_stat

- name: Remove stale forge symlink from system bin dir
  ansible.builtin.file:
    path: "{{ ai_system_bin_dir }}/forge"
    state: absent
  become: true
  when:
    - ai_forgecode_enabled | default(true)
    - ai_forgecode_link_stat.stat.islnk | default(false)

- name: Install ForgeCode via official installer (throwaway HOME, into system bin dir)
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      tmp="$(mktemp -d)"
      trap 'rm -rf "$tmp"' EXIT
      curl -fsSL https://forgecode.dev/cli | HOME="$tmp" sh
      install -m 0755 "$tmp/.local/bin/forge" "{{ ai_system_bin_dir }}/forge"
    executable: /bin/bash
  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin"
  register: ai_forgecode_install
  changed_when: ai_forgecode_install.rc == 0
  become: true
  when:
    - ai_forgecode_enabled | default(true)
    - not ai_forgecode_stat.stat.exists

# Migration: the previous HOME=/root flow left its source binary plus the
# fzf/bat/fd dependency downloads in /root/.local/bin. The installer's PATH
# export puts that directory first on root's shell PATH, so `sudo forge` /
# `sudo fzf` would keep running those frozen copies after the system bin dir
# got newer ones. Remove them so the system bin dir is the only source.
- name: Remove stale forge and installer-fetched deps from root home (old install flow)
  ansible.builtin.file:
    path: "/root/.local/bin/{{ item }}"
    state: absent
  become: true
  loop:
    - forge
    - fzf
    - bat
    - fd
  failed_when: false

- name: Verify ForgeCode installation
  ansible.builtin.command: "{{ ai_system_bin_dir }}/forge --help"
  register: ai_forgecode_verify
  changed_when: false
  failed_when: false
  when: ai_forgecode_enabled | default(true)

# -------------------------------------------------------------------------
# ZSH Plugin Integration (per-user)
#
# We deliberately do NOT use `forge zsh setup` here:
#   - it accepts no flags (an earlier `--yes` was rejected silently), and
#   - it edits ~/.zshrc directly, which is chezmoi-managed and would be wiped
#     by the next `chezmoi apply`.
# Instead we generate the plugin/theme scripts into ~/.forge/zsh/ (forge's own
# directory, not managed by chezmoi) and source them from
# ~/.config/zsh/env.zsh. That file is NOT chezmoi-managed, but the
# chezmoi-managed ~/.zshrc already sources it on the last line:
#   [ -f "$HOME/.config/zsh/env.zsh" ] && source "$HOME/.config/zsh/env.zsh"
# This keeps the forge integration out of chezmoi's managed surface entirely,
# so it survives `chezmoi apply` without depending on playbook role ordering.
# -------------------------------------------------------------------------
- name: Ensure ForgeCode zsh script directory exists
  ansible.builtin.file:
    path: "/home/{{ user.name }}/.forge/zsh"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: '0755'
  become: true
  when:
    - ai_forgecode_enabled | default(true)
    - ai_forgecode_zsh_enabled | default(true)

- name: Generate ForgeCode zsh plugin script
  ansible.builtin.command: forge zsh plugin
  environment:
    HOME: "/home/{{ user.name }}"
    PATH: "{{ ai_system_bin_dir }}:{{ ansible_facts['env']['PATH'] }}"
  register: ai_forgecode_plugin_out
  changed_when: false
  become: true
  become_user: "{{ user.name }}"
  when:
    - ai_forgecode_enabled | default(true)
    - ai_forgecode_zsh_enabled | default(true)

- name: Write ForgeCode zsh plugin script
  ansible.builtin.copy:
    dest: "/home/{{ user.name }}/.forge/zsh/forge.plugin.zsh"
    content: "{{ ai_forgecode_plugin_out.stdout }}"
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: '0644'
  become: true
  when:
    - ai_forgecode_enabled | default(true)
    - ai_forgecode_zsh_enabled | default(true)

- name: Generate ForgeCode zsh theme script
  ansible.builtin.command: forge zsh theme
  environment:
    HOME: "/home/{{ user.name }}"
    PATH: "{{ ai_system_bin_dir }}:{{ ansible_facts['env']['PATH'] }}"
  register: ai_forgecode_theme_out
  changed_when: false
  become: true
  become_user: "{{ user.name }}"
  when:
    - ai_forgecode_enabled | default(true)
    - ai_forgecode_zsh_enabled | default(true)

- name: Write ForgeCode zsh theme script
  ansible.builtin.copy:
    dest: "/home/{{ user.name }}/.forge/zsh/forge.theme.zsh"
    content: "{{ ai_forgecode_theme_out.stdout }}"
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: '0644'
  become: true
  when:
    - ai_forgecode_enabled | default(true)
    - ai_forgecode_zsh_enabled | default(true)

- name: Ensure zsh env drop-in directory exists
  ansible.builtin.file:
    path: "/home/{{ user.name }}/.config/zsh"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: '0755'
  become: true
  become_user: "{{ user.name }}"
  when:
    - ai_forgecode_enabled | default(true)
    - ai_forgecode_zsh_enabled | default(true)

- name: Source ForgeCode zsh integration from env.zsh
  ansible.builtin.blockinfile:
    path: "/home/{{ user.name }}/.config/zsh/env.zsh"
    create: true
    marker: "# {mark} ANSIBLE MANAGED BLOCK: forgecode zsh integration"
    block: |
      # ForgeCode zsh integration (plugin + theme)
      if command -v forge >/dev/null 2>&1; then
        [ -f "$HOME/.forge/zsh/forge.plugin.zsh" ] && source "$HOME/.forge/zsh/forge.plugin.zsh"
        [ -f "$HOME/.forge/zsh/forge.theme.zsh" ] && source "$HOME/.forge/zsh/forge.theme.zsh"
      fi
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: '0644'
  become: true
  become_user: "{{ user.name }}"
  when:
    - ai_forgecode_enabled | default(true)
    - ai_forgecode_zsh_enabled | default(true)


# The ai role runs before the dotfiles role, so on a fresh machine ~/.zshrc
# does not exist yet (chezmoi creates it later). blockinfile state=absent
# errors on a missing path, so only attempt the cleanup when the file exists.
- name: Check if user .zshrc exists
  ansible.builtin.stat:
    path: "/home/{{ user.name }}/.zshrc"

# Migration: remove the old forge block that used to be injected directly into
# the chezmoi-managed ~/.zshrc. That block was wiped on every `chezmoi apply`,
# causing drift. The integration now lives in ~/.config/zsh/env.zsh instead.
- name: Remove legacy forge block from chezmoi-managed .zshrc
  ansible.builtin.blockinfile:
    path: "/home/{{ user.name }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: forgecode zsh integration"
    state: absent
  become: true
  become_user: "{{ user.name }}"
  when:
    - ai_forgecode_enabled | default(true)
    - ai_forgecode_zsh_enabled | default(true)
    - ai_forgecode_zshrc_stat.stat.exists | default(false)

- name: Display ForgeCode installation status
  ansible.builtin.debug:
    msg: >-
      ForgeCode {{ 'installed' if (ai_forgecode_verify.rc | default(1)) == 0 else 'installation failed or not available' }}
      {{ 'with ZSH plugin sourced from ~/.config/zsh/env.zsh' if (ai_forgecode_zsh_enabled | default(true)) else '' }}
  when: ai_forgecode_enabled | default(true)

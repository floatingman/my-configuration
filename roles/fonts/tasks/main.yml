---
- name: Install freetype
  # Arch names the package freetype2; Fedora just freetype (cairo and
  # fontconfig share their names across both).
  become: true
  ansible.builtin.package:
    name: "{{ 'freetype2' if ansible_facts['os_family'] == 'Archlinux' else 'freetype' }}"
    state: present

- name: Install cairo
  become: true
  ansible.builtin.package:
    name: cairo
    state: present

- name: Install fontconfig
  become: true
  ansible.builtin.package:
    name: fontconfig
    state: present

- name: Enable LCD filter
  become: true
  ansible.builtin.file:
    src: /usr/share/fontconfig/conf.avail/11-lcdfilter-default.conf
    dest: /etc/fonts/conf.d/11-lcdfilter-default.conf
    state: link

- name: Enable sub-pixel rendering
  become: true
  ansible.builtin.file:
    src: /usr/share/fontconfig/conf.avail/10-sub-pixel-rgb.conf
    dest: /etc/fonts/conf.d/10-sub-pixel-rgb.conf
    state: link

- name: Enable hinting
  become: true
  ansible.builtin.file:
    src: /usr/share/fontconfig/conf.avail/10-hinting-slight.conf
    dest: /etc/fonts/conf.d/10-hinting-slight.conf
    state: link

- name: Push font substitutions
  become: true
  ansible.builtin.copy:
    src: local.conf
    dest: /etc/fonts/local.conf
    mode: '0644'

- name: Install base fonts
  become: true
  ansible.builtin.package:
    name: "{{ base_fonts }}"
    state: present
  when: ansible_facts["os_family"] == "Archlinux"

- name: Install base fonts (Fedora)
  # Name-mapped list (fedora_fonts in group_vars/all/base.yml). Fedora
  # packages no nerd-font variants, iosevka, sarasa-gothic or ubuntu — the
  # nerd-fonts role covers Hack/JetBrainsMono.
  become: true
  ansible.builtin.package:
    name: "{{ fedora_fonts }}"
    state: present
  when: ansible_facts["os_family"] == "RedHat"

- name: Install AUR fonts
  become: true
  kewlfft.aur.aur:
    name: "{{ aur_fonts }}"
    use: auto
    state: present
  become_user: aur_builder
  when: ansible_facts["os_family"] == "Archlinux"
  tags:
    - aur

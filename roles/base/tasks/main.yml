---
# Ansible creates per-module tmp dirs as the BECOME user (e.g. aur_builder),
# but the base dir (ansible_remote_tmp, /tmp/ansible-$USER) is 0700 owned by
# the invoking user — unprivileged become users then fail with "failed to
# create remote module tmp path ... permission denied". The invoking user and
# aur_builder share the wheel group, so make the base dir group-traversable.
- name: Make ansible module tmp dir writable by unprivileged become users
  ansible.builtin.file:
    path: "{{ ansible_remote_tmp }}"
    state: directory
    mode: "0770"
    group: wheel
  when: ansible_facts['os_family'] == 'Archlinux'

- name: Copy pacman configuration file
  ansible.builtin.copy:
    src: pacman.conf
    dest: /etc/pacman.conf
    mode: '0644'
  become: true

- name: Refresh pacman mirrors
  ansible.builtin.package:
    update_cache: true
  become: true

- name: Install inetutils for hostname
  ansible.builtin.package:
    name: inetutils
    state: present
  become: true

- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ hostname }}"
  # hostnamectl cannot change a container's UTS namespace ("Device or
  # resource busy"); set the hostname with `docker run --hostname` instead.
  when:
    - hostname is defined
    - not (ansible_facts['virtualization_role'] | default('') == 'guest' and
           ansible_facts['virtualization_type'] | default('') == 'docker')
  become: true

- name: User tasks
  ansible.builtin.include_tasks: user.yml
- name: Sudo tasks
  ansible.builtin.include_tasks: sudo.yml
- name: Packages tasks
  ansible.builtin.include_tasks: packages.yml
- name: Journal tasks
  ansible.builtin.include_tasks: journal.yml

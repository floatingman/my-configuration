---
# System-wide tool groups
#
# The `devtools` and `linuxbrew` groups make system-wide tool installations
# (asdf -> /opt/asdf, Linuxbrew -> /home/linuxbrew, Rust -> /opt/rust, etc.)
# usable by every user on the machine. They are also created by the Arch-only
# `base` role (roles/base/tasks/user.yml), but that role is skipped on Debian,
# so we ensure them here unconditionally. This role runs before asdf, homebrew,
# and rust in play.yml, and the tasks are idempotent.
# See docs/adr/0001-system-wide-tool-installation.md.

- name: Ensure devtools group exists
  ansible.builtin.group:
    name: devtools
    state: present
  become: true

- name: Ensure linuxbrew group exists
  ansible.builtin.group:
    name: linuxbrew
    state: present
  become: true

# GitHub 401-challenges anonymous protocol-v2 git requests sent over HTTP/2,
# which makes unattended git fetches (asdf clone as root, ansible git module
# under become, cron jobs) prompt for credentials and die with no TTY. The
# user-level override lives in the dotfiles gitconfig template; this system
# file covers root and service users. HTTP/1.1 (or protocol v0/v1) works.
- name: Configure git to use HTTP/1.1 for GitHub HTTPS remotes
  # blockinfile, not copy: preserve any pre-existing /etc/gitconfig content
  # (safe.directory, proxies, credential helpers) — manage only this setting.
  ansible.builtin.blockinfile:
    path: /etc/gitconfig
    create: true
    owner: root
    group: root
    mode: '0644'
    marker: "# {mark} ansible: github anonymous-git 401 workaround"
    block: |
      # GitHub 401-challenges anonymous protocol-v2 git requests sent over
      # HTTP/2, which makes unattended git fetches prompt for credentials.
      # Force HTTP/1.1 for GitHub HTTPS remotes; all other combinations work.
      [http "https://github.com/"]
        version = HTTP/1.1
  become: true
  tags:
    - asdf

- name: Install hdparm
  become: true
  ansible.builtin.package:
    name: hdparm
    state: present
  when: ansible_facts["distribution"] == "Archlinux"

- name: Enable and start weekly filesystem TRIM timer
  become: true
  ansible.builtin.service:
    name: fstrim.timer
    enabled: true
  when: ansible_facts["distribution"] == "Archlinux"

# -------------------------------------------------------------------------
# Legacy asdf aws-vault removal
# -------------------------------------------------------------------------
# aws-vault moved off asdf (Arch: extra package via the packages role;
# Debian: direct binary download via ansible-role-binaries). The external
# asdf role only installs plugins declared in `asdf_plugins` — it never
# removes undeclared ones — so machines that had the plugin keep resolving
# aws-vault to the stale /opt/asdf install (99designs fork, stuck at 7.2.0)
# because /opt/asdf/shims precedes /usr/bin in PATH. Removing the plugin
# tree and shim drops aws-vault back to the package/binary on PATH. The
# ~/.tool-versions entry must go too, or asdf warns about the unknown
# plugin on every shim exec. Tagged `asdf` so `make configure TAGS="asdf"`
# repairs existing machines.
- name: Remove legacy asdf aws-vault plugin, installs, and shim
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/asdf/plugins/aws-vault
    - /opt/asdf/installs/aws-vault
    - /opt/asdf/shims/aws-vault
  become: true
  tags:
    - asdf

- name: Remove stale aws-vault pin from user .tool-versions
  ansible.builtin.lineinfile:
    # ansible.cfg sets inject_facts_as_vars=false, so ansible_user_dir is
    # undefined; read HOME from the controller env (correct for the local
    # connection this playbook always runs under — see pass_cli defaults).
    path: "{{ lookup('env', 'HOME') }}/.tool-versions"
    regexp: "^aws-vault\\s"
    state: absent
  tags:
    - asdf

- name: Remove stale aws-vault pin from system-wide .tool-versions
  ansible.builtin.lineinfile:
    path: /opt/asdf/.tool-versions
    regexp: "^aws-vault\\s"
    state: absent
  become: true
  tags:
    - asdf

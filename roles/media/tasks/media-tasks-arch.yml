---
- name: Install misc media codecs and helpers Arch
  become: true
  ansible.builtin.package:
    name:
      - flac
      - lame
      - gst-libav
      - gst-plugins-good
      - exiv2
      - perl-image-exiftool
      - perl-archive-zip
      - opus-tools
    state: present

- name: Install zbar
  become: true
  ansible.builtin.package:
    name: zbar
    state: present

- name: Install svgcleaner
  become: true
  ansible.builtin.package:
    name: svgcleaner
    state: present

- name: Install media players
  become: true
  ansible.builtin.package:
    name:
      - vlc
      - vlc-plugins-all
      - gammastep
    state: present

- name: Install VapourSynth plugins from AUR
  become: true
  become_user: aur_builder
  kewlfft.aur.aur:
    name:
      - vapoursynth-plugin-mvtools-git
      # vapoursynth-plugin-vmaf-git dropped 2026-10: its PKGBUILD references
      # a meson checkasm.wrap subproject it doesn't ship, so every build
      # fails under makepkg's --wrap-mode nodownload. For VMAF scoring use
      # ffmpeg's libvmaf filter instead.
    use: auto
    state: present
  when: ansible_facts["os_family"] == "Archlinux"
  tags:
    - aur

---
# Names verified against the Fedora 45 repository (live check 2026-11):
# exiftool ships as perl-Image-ExifTool and the zbar CLI tools are part of
# the zbar package (Debian splits them into zbar-tools).
- name: Install misc media codecs and helpers Fedora
  become: true
  ansible.builtin.package:
    name:
      - flac
      - lame
      - gstreamer1-plugin-libav
      - gstreamer1-plugins-good
      - exiv2
      - perl-Image-ExifTool
      - perl-Archive-Zip
      - opus-tools
    state: present

- name: Install zbar
  become: true
  ansible.builtin.package:
    name: zbar
    state: present

- name: Install media players
  # vlc entered Fedora's official repos in F43 (no plugins-all subpackage
  # exists there); svgcleaner is not packaged on Fedora at all and stays
  # Arch-only (all names verified against the F45 repo, live 2026-11).
  become: true
  ansible.builtin.package:
    name:
      - vlc
      - gammastep
    state: present

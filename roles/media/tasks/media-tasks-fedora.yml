---
# Fedora renames: exiftool is perl-Image-ExifTool; zbar CLI tools are part
# of zbar (Debian splits them into zbar-tools).
- name: Install misc media codecs and helpers Fedora
  become: true
  ansible.builtin.package:
    name:
      - flac
      - lame
      - gstreamer1-plugin-libav
      - gstreamer1-plugins-good
      - exiv2
      - perl-Image-ExifTool
      - perl-Archive-Zip
      - opus-tools
    state: present

- name: Install zbar
  become: true
  ansible.builtin.package:
    name: zbar
    state: present

- name: Install media players
  # vlc is in Fedora's official repos (no plugins-all subpackage exists);
  # svgcleaner is not packaged on Fedora and stays Arch-only.
  become: true
  ansible.builtin.package:
    name:
      - vlc
      - gammastep
    state: present

---
# Terminal emulators. alacritty and kitty share their names across Arch,
# Debian and Fedora, so the generic tasks cover all three. ghostty and
# wezterm have no Fedora RPMs: ghostty comes from the pgdev/ghostty COPR
# (opt out via terminal_enable_ghostty_copr), wezterm from upstream's
# flathub channel (Debian uses the fury.io apt repo instead).
- name: Install alacritty
  become: true
  ansible.builtin.package:
    name: alacritty
    state: present
  tags:
    - terminal

- name: Install kitty
  become: true
  ansible.builtin.package:
    name: kitty
    state: present
  tags:
    - terminal

- name: Install Wezterm
  become: true
  ansible.builtin.package:
    name: wezterm
    state: present
  when: ansible_facts["os_family"] == "Archlinux"
  tags:
    - terminal

- name: Install dnf5-plugins for COPR support (Fedora)
  # community.general.copr drives `dnf copr`, which dnf5 ships in
  # dnf5-plugins rather than the old dnf-plugins-core.
  become: true
  ansible.builtin.package:
    name: dnf5-plugins
    state: present
  when:
    - ansible_facts["os_family"] == "RedHat"
    - terminal_enable_ghostty_copr
  tags:
    - terminal

- name: Enable the ghostty COPR (Fedora)
  # Community COPR build: upstream ships no RPM or flatpak for Fedora.
  # Opt out per host with terminal_enable_ghostty_copr: false.
  become: true
  community.general.copr:
    name: pgdev/ghostty
    state: enabled
  when:
    - ansible_facts["os_family"] == "RedHat"
    - terminal_enable_ghostty_copr
  tags:
    - terminal

- name: Install Ghostty
  become: true
  ansible.builtin.package:
    name: ghostty
    state: present
  when: >-
    ansible_facts["os_family"] == "Archlinux"
    or (ansible_facts["os_family"] == "RedHat" and terminal_enable_ghostty_copr)
  tags:
    - terminal

- name: Download the wezterm signing key
  ansible.builtin.apt_key:
    url: https://apt.fury.io/wez/gpg.key
    state: present
    keyring: /etc/apt/keyrings/wezterm-fury.gpg
  when: ansible_facts["os_family"] == "Debian"

- name: Add wezterm repository into sources list
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/etc/apt/keyrings/wezterm-fury.gpg] https://apt.fury.io/wez/ * *
    state: present
    filename: wezterm
  when: ansible_facts["os_family"] == "Debian"

- name: Install wezterm
  ansible.builtin.apt:
    name: wezterm
    update_cache: true
  when: ansible_facts["os_family"] == "Debian"

- name: Install wezterm from flathub (Fedora)
  # Upstream's official Fedora channel: no RPM exists and the flathub remote
  # is already configured system-wide by the flatpak role.
  become: true
  community.general.flatpak:
    name: org.wezfurlong.wezterm
    remote: flathub
    method: system
    state: present
  when: ansible_facts["os_family"] == "RedHat"
  tags:
    - terminal

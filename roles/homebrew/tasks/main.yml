---
# tasks file for homebrew
# Homebrew is installed to /home/linuxbrew/.linuxbrew (a system path).
# We make it accessible to all users via the linuxbrew group and /etc/profile.d/.
# Note: the linuxbrew group is ensured by the system role (roles/system/tasks/main.yml),
# which runs on all OSes (the base role that also creates it is Arch-only).
# to ensure it exists before the user is added to it.

- name: Check if Homebrew is already installed
  ansible.builtin.stat:
    path: /home/linuxbrew/.linuxbrew/bin/brew
  register: homebrew_check

- name: Install Homebrew dependencies (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - build-essential
      - procps
      - curl
      - file
      - git
    state: present
    update_cache: true
  become: true
  when:
    - ansible_facts['os_family'] == "Debian"
    - not homebrew_check.stat.exists

- name: Install Homebrew dependencies (Arch)
  community.general.pacman:
    name:
      - base-devel
      - curl
      - file
      - git
    state: present
  become: true
  when:
    - ansible_facts['os_family'] == "Archlinux"
    - not homebrew_check.stat.exists

- name: Ensure linuxbrew group exists
  ansible.builtin.group:
    name: linuxbrew
    state: present
  become: true

# Create BOTH the base dir and the .linuxbrew dir owned by the primary user.
# Ansible's file module auto-creates intermediate parents as root, so we must
# create /home/linuxbrew explicitly with the correct owner or it ends up
# root-owned (which is what causes brew to misbehave on a fresh install).
- name: Create Homebrew base directory (/home/linuxbrew)
  ansible.builtin.file:
    path: "/home/linuxbrew"
    state: directory
    owner: "{{ user.name }}"
    group: linuxbrew
    mode: '2775'
  become: true

- name: Create Homebrew directory
  ansible.builtin.file:
    path: "/home/linuxbrew/.linuxbrew"
    state: directory
    owner: "{{ user.name }}"
    group: linuxbrew
    mode: '2775'
  become: true
  when:
    - not homebrew_check.stat.exists

- name: Download Homebrew tarball
  ansible.builtin.get_url:
    url: https://github.com/Homebrew/brew/tarball/master
    dest: /tmp/homebrew-brew.tar.gz
    mode: '0644'
  become: true
  when:
    - not homebrew_check.stat.exists

- name: Extract Homebrew
  ansible.builtin.unarchive:
    src: /tmp/homebrew-brew.tar.gz
    dest: /home/linuxbrew/.linuxbrew
    remote_src: true
    extra_opts:
      - --strip-components=1
    owner: "{{ user.name }}"
    group: linuxbrew
  become: true
  when:
    - not homebrew_check.stat.exists

- name: Remove temporary Homebrew tarball
  ansible.builtin.file:
    path: /tmp/homebrew-brew.tar.gz
    state: absent
  become: true
  when:
    - not homebrew_check.stat.exists

# Normalize the whole tree (parent + .linuxbrew) so brew can run as the
# primary user while remaining usable by every linuxbrew group member.
# group-writable + setgid bits ensure newly-created files (taps, Cellar,
# downloads) inherit the linuxbrew group. This matches the ownership model
# the `ai` role expects, making its one-time migration a no-op.
- name: Normalize Homebrew ownership for multi-user access
  ansible.builtin.shell:
    cmd: >
      chown -R {{ user.name }}:linuxbrew /home/linuxbrew &&
      chmod -R g+rwX /home/linuxbrew &&
      find /home/linuxbrew -type d -exec chmod g+s {} +
    executable: /bin/bash
  become: true
  changed_when: false

- name: Create /etc/profile.d/linuxbrew.sh for system-wide PATH
  ansible.builtin.copy:
    dest: /etc/profile.d/linuxbrew.sh
    content: |
      # Add Linuxbrew to PATH for all users
      if [ -d /home/linuxbrew/.linuxbrew/bin ]; then
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
      fi
      if [ -d /home/linuxbrew/.linuxbrew/sbin ]; then
          export PATH="/home/linuxbrew/.linuxbrew/sbin:$PATH"
      fi
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Install Homebrew tap packages
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  loop: "{{ homebrew_tap_packages | default([]) }}"
  when:
    - homebrew_tap_packages is defined and homebrew_tap_packages | length > 0
    - ansible_facts['os_family'] == "Debian"

- name: Install Homebrew packages
  community.general.homebrew:
    name: "{{ item }}"
    state: present
    path: /home/linuxbrew/.linuxbrew/bin
  loop: "{{ homebrew_packages | default([]) }}"
  when:
    - homebrew_packages is defined and homebrew_packages | length > 0
    - ansible_facts['os_family'] == "Debian"

# Homebrew's zsh completion dir (share/zsh/site-functions) lives under the
# group-writable multi-user tree, so zsh's compinit flags it as an "insecure
# directory" and prompts "Ignore insecure directories and continue?" on every
# shell startup. Remove group-write from the completion tree so compinit is
# happy. brew runs as the tree owner, so this does not affect its ability to
# update completions — it only stops other group members from writing them
# (which they never need to). Run after package install so freshly-created
# completion dirs are covered.
- name: Make Homebrew zsh completions non-group-writable (fix compinit prompt)  # noqa: command-instead-of-file
  ansible.builtin.command:
    cmd: chmod -R g-w /home/linuxbrew/.linuxbrew/share/zsh
  become: true
  become_user: "{{ user.name }}"
  changed_when: false
  when: ansible_facts['os_family'] == "Debian"

---
- name: Require /boot on the EFI partition for themed boot
  # Old installs kept /boot on the encrypted root (GRUB cryptodisk):
  # there GRUB shows its unthemed passphrase prompt before any theme
  # loads, so theming and splash can never work as documented. Fail
  # before mutating anything instead of deploying a broken theme.
  ansible.builtin.assert:
    that: ansible_facts["mounts"] | selectattr("mount", "equalto", "/boot") | map(attribute="fstype") | join("") == "vfat"
    fail_msg: >-
      /boot is not the vfat EFI partition this role's themed-boot path
      assumes. Migrate the machine by reinstalling with the current
      install.sh (see INSTALL.md), or disable the path for this host by
      setting grub_theme: null and removing splash from
      grub_kernel_parameters in group_vars/all/local.yml.
  when:
    - grub_theme is not none or (grub_kernel_parameters is not none and grub_kernel_parameters is search("splash"))

- name: Set kernel parameters
  ansible.builtin.lineinfile:
    dest: /etc/default/grub
    regexp: "^GRUB_CMDLINE_LINUX_DEFAULT"
    state: present
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="{{ grub_kernel_parameters }}"'
  when: grub_kernel_parameters is not none
  become: true
  notify:
    - Rebuild grub

- name: Install plymouth
  # TAGS=grub runs skip the base role that otherwise installs the
  # package; mkinitcpio -P fails on a hook whose package is missing.
  ansible.builtin.package:
    name: plymouth
    state: present
  become: true
  when:
    - ansible_facts["distribution"] == "Archlinux"
    - grub_kernel_parameters is not none
    - grub_kernel_parameters is search("splash")

- name: Read mkinitcpio hooks
  ansible.builtin.command: grep -E "^HOOKS=" /etc/mkinitcpio.conf
  register: grub_mkinitcpio_hooks
  changed_when: false
  failed_when: false
  when:
    - ansible_facts["distribution"] == "Archlinux"
    - grub_kernel_parameters is not none
    - grub_kernel_parameters is search("splash")

- name: Add plymouth mkinitcpio hook
  # The plymouth package never edits HOOKS; without this task, existing
  # machines would keep the raw passphrase prompt and a silent console.
  ansible.builtin.replace:
    path: /etc/mkinitcpio.conf
    # Tempered so the match fails if plymouth appears anywhere before
    # encrypt (never inserts a second one), and encrypt must be a whole
    # token: not the suffix of sd-encrypt.
    regexp: '^(HOOKS=\((?:(?!plymouth)[^)])*?)(?<=\(| )encrypt\b'
    replace: '\1plymouth encrypt'
  become: true
  when:
    - ansible_facts["distribution"] == "Archlinux"
    - grub_kernel_parameters is not none
    - grub_kernel_parameters is search("splash")
    - grub_mkinitcpio_hooks.stdout is defined
    - "'plymouth' not in grub_mkinitcpio_hooks.stdout"
  notify:
    - Rebuild initramfs

- name: Disable Grub submenus
  ansible.builtin.lineinfile:
    dest: /etc/default/grub
    regexp: "^GRUB_DISABLE_SUBMENU"
    state: present
    line: "GRUB_DISABLE_SUBMENU=y"
  become: true
  notify:
    - Rebuild grub

- name: Create GRUB themes directory
  ansible.builtin.file:
    path: /boot/grub/themes
    state: directory
    mode: "0755"
  become: true
  when: grub_theme is not none

- name: Deploy GRUB theme
  # mode 0755 for everything: /boot is vfat (ESP), which reports every file
  # as 0755; any narrower mode would read back changed on every run.
  ansible.builtin.copy:
    src: "grub-themes/{{ grub_theme }}"
    dest: /boot/grub/themes/
    mode: "0755"
  become: true
  when: grub_theme is not none
  notify:
    - Rebuild grub

- name: Set GRUB theme
  # Unguarded on purpose: grub_theme: null removes a previously set
  # GRUB_THEME line instead of leaving the old theme active.
  ansible.builtin.lineinfile:
    dest: /etc/default/grub
    regexp: "^GRUB_THEME="
    state: "{{ 'present' if grub_theme is not none else 'absent' }}"
    line: 'GRUB_THEME="/boot/grub/themes/{{ grub_theme }}/theme.txt"'
  become: true
  notify:
    - Rebuild grub

- name: Check for EFI BootNext helper
  # grub >= 2.12 ships 31_efi_bootnext, which mirrors every firmware boot
  # entry (Setup, diagnostics, USB/NVMe/ATA, ...) into the GRUB menu.
  ansible.builtin.stat:
    path: /etc/grub.d/31_efi_bootnext
  register: grub_efi_bootnext

- name: Disable EFI BootNext menu entries
  ansible.builtin.file:
    path: /etc/grub.d/31_efi_bootnext
    mode: u-x,g-x,o-x
  become: true
  when: grub_efi_bootnext.stat.exists
  notify:
    - Rebuild grub

- name: Install Grub Pacman hook
  kewlfft.aur.aur:
    name: grub-hook
    use: auto
    state: present
  become: true
  become_user: aur_builder
  when: ansible_facts["distribution"] == "Archlinux"
  tags:
    - aur

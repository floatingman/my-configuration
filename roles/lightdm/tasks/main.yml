---
- name: Install LightDM
  become: true
  ansible.builtin.package:
    name:
      - lightdm
      - lightdm-gtk-greeter
    state: present

- name: Point display-manager.service at LightDM
  # OEM installs pre-link display-manager.service at their own greeter
  # (e.g. plasmalogin.service on Framework's Fedora KDE image); systemctl
  # enable refuses to overwrite an existing alias, so own the symlink
  # explicitly. force=true makes it a no-op when already correct.
  become: true
  ansible.builtin.file:
    src: /usr/lib/systemd/system/lightdm.service
    dest: /etc/systemd/system/display-manager.service
    state: link
    force: true

- name: Enable LightDM
  # daemon_reload: after re-pointing the display-manager.service symlink,
  # systemd's cached alias can make enable fail with FileExists.
  become: true
  ansible.builtin.service:
    name: lightdm.service
    enabled: true
    daemon_reload: true

- name: Create background dir
  become: true
  ansible.builtin.file:
    path: /usr/share/backgrounds
    state: directory
    mode: '0755'

- name: Push LightDM greeter background
  become: true
  ansible.builtin.copy:
    src: M31_Galex_960.jpg
    dest: /usr/share/backgrounds/M31_Galex_960.jpg
    mode: '0644'

- name: Specify LightDM greeter background
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/lightdm/lightdm-gtk-greeter.conf
    regexp: "^background="
    state: present
    line: "background=/usr/share/backgrounds/M31_Galex_960.jpg"

- name: Hide user images
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/lightdm/lightdm-gtk-greeter.conf
    regexp: "^hide-user-image="
    state: present
    line: "hide-user-image=true"

- name: Force LightDM greeter theme
  become: true
  ansible.builtin.lineinfile:
    dest: /usr/share/xgreeters/lightdm-gtk-greeter.desktop
    regexp: "^Exec="
    state: present
    line: "Exec=env GTK_THEME=Adwaita:dark lightdm-gtk-greeter"

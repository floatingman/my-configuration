---
- name: Create the `aur_builder` user
  become: true
  ansible.builtin.user:
    name: aur_builder
    create_home: true
    group: wheel

- name: Allow the `aur_builder` user to run `sudo pacman` without a password
  become: true
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/11-install-aur_builder
    line: "aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman"
    create: true
    mode: '0440'
    validate: "visudo -cf %s"

- name: Remove haskell-linked pandoc and shellcheck (replaced by -bin builds)
  # The repo pandoc-cli/shellcheck builds link against the GHC library stack:
  # 200+ haskell-* packages that re-release on every GHC bump, so every -Syu
  # drags hundreds of unrelated updates. The static pandoc-bin/shellcheck-bin
  # AUR builds below replace them; --recursive drops the orphaned haskell tree.
  community.general.pacman:
    name:
      - pandoc-cli
      - shellcheck
    state: absent
    extra_args: "--recursive --unneeded"
  become: true
  when: ansible_facts['os_family'] == "Archlinux" and aur is defined

- name: Install Yay
  kewlfft.aur.aur:
    name: yay
    use: auto
    state: present
  become: true
  become_user: aur_builder
  when: ansible_facts['os_family'] == "Archlinux" and aur is defined

- name: Install Arch Aur packages
  kewlfft.aur.aur:
    name: "{{ aur.packages }}"
    use: auto
    state: present
  become: true
  become_user: aur_builder
  when: ansible_facts['os_family'] == "Archlinux" and aur is defined

# highlight-pointer-git and slack-term-bin were previously installed from the
# AUR but are no longer managed here (unused; the `binaries` fallback is
# Debian-only). warp-terminal was dropped from the shell role (huge AUR build
# that times out); hey-bin's S3 source 403s — hey now installs via direct
# download in the shell role; clion/clion-gdb/clion-lldb sources 404 on the
# dead download-cf.jetbrains.com CDN — clion now installs via a direct
# tarball in the devtools role (which bundles its own debuggers). The 2026-10
# sweep also renamed or dropped: windsurf-next (discontinued), llmfit→
# llmfit-git, autotiling→autotiling-git, protonmail-bridge(-core)→-free
# variants, syncthingtray-qt6→syncthingtray (extra), gdm-plymouth→gdm,
# xorg-server-xwayland→xorg-xwayland, hyprland-qtutils→hyprland-qt-support,
# bind-tools→bind, p7zip→7zip (repo-side renames handled by their roles).
- name: Remove deprecated AUR packages
  kewlfft.aur.aur:
    name:
      - highlight-pointer-git
      - slack-term-bin
      - warp-terminal
      - hey-bin
      - clion
      - clion-gdb
      - taskopen
    state: absent
  become: true
  become_user: aur_builder
  when: ansible_facts['os_family'] == "Archlinux" and aur is defined

# Names that no longer exist in ANY repo cannot go through yay -R: on
# machines where they were never installed, yay aborts with "target not
# found". The pacman module treats absent-and-missing as a clean no-op.
- name: Remove packages dropped from the AUR entirely
  community.general.pacman:
    name:
      - windsurf-next
      - llmfit
      - autotiling
      - protonmail-bridge
      - protonmail-bridge-core
      - syncthingtray-qt6
      - gdm-plymouth
    state: absent
  become: true
  when: ansible_facts['os_family'] == "Archlinux" and aur is defined

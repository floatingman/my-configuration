---
- name: Create the `aur_builder` user
  become: true
  ansible.builtin.user:
    name: aur_builder
    create_home: true
    group: wheel

- name: Allow the `aur_builder` user to run `sudo pacman` without a password
  become: true
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/11-install-aur_builder
    line: "aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman"
    create: true
    mode: '0440'
    validate: "visudo -cf %s"

- name: Remove haskell-linked pandoc and shellcheck (replaced by -bin builds)
  # The repo pandoc-cli/shellcheck builds link against the GHC library stack:
  # 200+ haskell-* packages that re-release on every GHC bump, so every -Syu
  # drags hundreds of unrelated updates. The static pandoc-bin/shellcheck-bin
  # AUR builds below replace them; --recursive drops the orphaned haskell tree.
  community.general.pacman:
    name:
      - pandoc-cli
      - shellcheck
    state: absent
    extra_args: "--recursive --unneeded"
  become: true
  when: ansible_facts['os_family'] == "Archlinux" and aur is defined

- name: Install Yay
  kewlfft.aur.aur:
    name: yay
    use: auto
    state: present
  become: true
  become_user: aur_builder
  when: ansible_facts['os_family'] == "Archlinux" and aur is defined

- name: Install Arch Aur packages
  kewlfft.aur.aur:
    name: "{{ aur.packages }}"
    use: auto
    state: present
  become: true
  become_user: aur_builder
  when: ansible_facts['os_family'] == "Archlinux" and aur is defined

# highlight-pointer-git and slack-term-bin were previously installed from the
# AUR but are no longer managed here (unused; the `binaries` fallback is
# Debian-only). warp-terminal was dropped from the shell role: its AUR build
# is enormous and regularly times out. Remove all so leftovers don't linger.
- name: Remove deprecated AUR packages
  kewlfft.aur.aur:
    name:
      - highlight-pointer-git
      - slack-term-bin
      - warp-terminal
    use: auto
    state: absent
  become: true
  become_user: aur_builder
  when: ansible_facts['os_family'] == "Archlinux" and aur is defined

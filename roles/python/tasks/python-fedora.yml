---
# Ensure pipx and the standard Python tooling are present on Fedora.
# Mirrors python-debian.yml (Arch has its own python-arch.yml): the PATH
# shim, ~/.local/bin, and pipx ensurepath behavior are identical. Fedora
# package names verified against the Fedora 45 Everything repo metadata.
# python3-venv does not exist on Fedora (the venv module ships with
# python3), and build-essential maps to gcc + gcc-c++ + make. uv is
# installed here (as on Arch) so uv_python_packages works on Fedora.

- name: Install pipx and Python build tooling (Fedora)
  become: true
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - pipx
      - python3-devel
      - gcc
      - gcc-c++
      - make
      - uv
    state: present

- name: Ensure ~/.local/bin is on PATH for all login shells
  become: true
  ansible.builtin.copy:
    dest: /etc/profile.d/user_local_bin.sh
    content: |
      # Add per-user pipx/pip installs to PATH
      if [ -d "$HOME/.local/bin" ]; then
          case ":$PATH:" in
              *":$HOME/.local/bin:"*) ;;
              *) export PATH="$HOME/.local/bin:$PATH" ;;
          esac
      fi
    owner: root
    group: root
    mode: '0755'

- name: Ensure ~/.local/bin exists for the primary user
  ansible.builtin.file:
    path: "/home/{{ user.name }}/.local/bin"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.group | default(user.name) }}"
    mode: '0755'

- name: Run pipx ensurepath for the primary user
  ansible.builtin.command: pipx ensurepath
  become: true
  become_user: "{{ user.name }}"
  environment:
    PATH: "/home/{{ user.name }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
  changed_when: false
  failed_when: false

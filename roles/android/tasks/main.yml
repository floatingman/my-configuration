---
- name: Install android-tools
  become: true
  ansible.builtin.package:
    name: android-tools
    state: present
  when: ansible_facts["os_family"] == "Archlinux"

- name: Install android-tools (Debian)
  become: true
  ansible.builtin.package:
    name: android-platform-tools-base
    state: present
  when: ansible_facts["os_family"] == "Debian"

- name: Install android-tools (Fedora)
  # Fedora packages the SDK tools under the Arch name; there is no
  # android-platform-tools-base there, and android-udev is Arch-only (the
  # udev rules ship inside Fedora's android-tools package).
  become: true
  ansible.builtin.package:
    name: android-tools
    state: present
  when: ansible_facts["os_family"] == "RedHat"

- name: Install android-udev
  become: true
  ansible.builtin.package:
    name: android-udev
    state: present
  when: ansible_facts["os_family"] == "Archlinux"

- name: Add user to adbusers group - {{ user.name }}
  become: true
  ansible.builtin.user:
    name: "{{ user.name }}"
    groups: adbusers
    append: true
  when: ansible_facts["os_family"] == "Archlinux"
  tags:
    - user

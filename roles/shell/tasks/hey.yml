---
# rakyll/hey publishes no GitHub release assets, and the AUR `hey-bin`
# package fetches its binary from an S3 bucket that now returns 403 — every
# fresh build fails. The GCS release URL below (the same one the Debian-side
# `binaries` entry uses) is still live, so install from it directly.
#
# Idempotency: get_url uses a conditional GET to /tmp, and copy compares
# content, so runs are cheap and only report changed on a real update.
- name: Fetch hey release binary
  ansible.builtin.get_url:
    url: "{{ shell_hey_url }}"
    dest: /tmp/hey_linux_amd64
    mode: '0755'
  tags:
    - shell
    - hey

- name: Install hey to /usr/local/bin
  ansible.builtin.copy:
    src: /tmp/hey_linux_amd64
    dest: /usr/local/bin/hey
    mode: '0755'
    remote_src: true
  become: true
  when: ansible_facts['os_family'] == 'Archlinux'
  tags:
    - shell
    - hey

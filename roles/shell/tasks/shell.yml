---
# The `shell` role runs early in play.yml — before `packages`/`homebrew` on
# Debian — so git may not be installed yet when the plugin/TPM/fzf clones below
# run. Ensure it here once for Debian (the Arch `base` role already installs it).
- name: Ensure git is present (Debian/Ubuntu)
  ansible.builtin.package:
    name: git
    state: present
  become: true
  when: ansible_facts['os_family'] == "Debian"
  tags:
    - shell

- name: Install Bash
  ansible.builtin.package:
    name:
      - bash
      - bash-completion
    state: present
  become: true
  tags:
    - shell

- name: Install Zsh
  ansible.builtin.package:
    name:
      - zsh
    state: present
  become: true
  tags:
    - shell

# The user's login shell is only set by the Arch-only `base` role's user task
# (play.yml gates it on _is_arch), so on Debian/Ubuntu it never changed even
# though local.yml specifies user.shell. Set it here, after zsh is installed,
# on every system — the user module is idempotent (plain usermod under the hood).
- name: Set user login shell
  ansible.builtin.user:
    name: "{{ user.name }}"
    shell: "{{ user.shell }}"
  become: true
  tags:
    - shell
    - user
# asdf is installed system-wide to /opt/asdf, but the external asdf role only
# writes /etc/profile.d/asdf.sh — which (a) is bash-only
# (`[ -n "$BASH_VERSION" ] || return 0`) and (b) zsh never sources
# /etc/profile.d anyway. Without this block, no asdf-managed language (node,
# etc.) is on PATH in zsh, and `pi` falls back to the system Node (too old).
# Source asdf.sh in /etc/zsh/zshrc so every interactive zsh gets asdf.
#
# Export /opt/asdf UNCONDITIONALLY (when it exists): `:-` defaults preserve a
# stale ASDF_DATA_DIR (e.g. ~/.asdf) inherited from long-running parents
# (herdr, tmux) started before an env fix. A wrong ASDF_DATA_DIR makes every
# asdf shim (node, npm, pi) exec against a data dir with no plugins and fail
# silently with rc=126.

- name: Initialize asdf for interactive zsh shells
  ansible.builtin.blockinfile:
    path: /etc/zsh/zshrc
    create: true
    mode: '0644'
    marker: "# {mark} ANSIBLE MANAGED BLOCK (asdf)"
    block: |
      if [ -d /opt/asdf ]; then
          export ASDF_DIR="/opt/asdf"
          export ASDF_DATA_DIR="/opt/asdf"
          if [ -f "$ASDF_DIR/asdf.sh" ]; then
              . "$ASDF_DIR/asdf.sh"
          fi
      fi
  become: true
  tags:
    - shell

- name: Install Zsh Completions
  ansible.builtin.package:
    name:
      - zsh-completions
    state: present
  become: true
  tags:
    - shell
  when: ansible_facts['os_family'] == "Archlinux"

- name: Install Starship
  ansible.builtin.package:
    name:
      - starship
    state: present
  become: true
  tags:
    - shell
  when: ansible_facts['os_family'] == "Archlinux"

# On Debian/Ubuntu the `shell` role runs BEFORE the `homebrew` role in play.yml,
# so Homebrew is not available yet. Use starship's official installer instead;
# it is self-contained and installs to /usr/local/bin (already on PATH).
- name: Download Starship installer (Debian/Ubuntu)
  ansible.builtin.get_url:
    url: https://starship.rs/install.sh
    dest: /tmp/starship-install.sh
    mode: '0755'
  become: true
  when: ansible_facts['os_family'] == "Debian"
  tags:
    - shell

- name: Install Starship (Debian/Ubuntu)
  ansible.builtin.command:
    cmd: /tmp/starship-install.sh -y
  args:
    creates: /usr/local/bin/starship
  become: true
  when: ansible_facts['os_family'] == "Debian"
  tags:
    - shell

- name: Remove Starship installer (Debian/Ubuntu)
  ansible.builtin.file:
    path: /tmp/starship-install.sh
    state: absent
  become: true
  when: ansible_facts['os_family'] == "Debian"
  tags:
    - shell

- name: Install blesh
  kewlfft.aur.aur:
    name: blesh
    use: auto
    state: present
  become: true
  become_user: aur_builder
  when: ansible_facts["os_family"] == "Archlinux"
  tags:
    - aur

# kubectl aliases (ahmetb/kubectl-alias) sourced from ~/.shell/kubectl_aliases.
- name: Ensure ~/.shell exists
  ansible.builtin.file:
    path: "/home/{{ user.name }}/.shell"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.group | default(user.name) }}"
    mode: '0755'
  become: true
  become_user: "{{ user.name }}"
  tags:
    - shell

- name: Download kubectl aliases
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ahmetb/kubectl-alias/master/.kubectl_aliases
    dest: "/home/{{ user.name }}/.shell/kubectl_aliases"
    owner: "{{ user.name }}"
    group: "{{ user.group | default(user.name) }}"
    mode: '0644'
  become: true
  become_user: "{{ user.name }}"
  tags:
    - shell

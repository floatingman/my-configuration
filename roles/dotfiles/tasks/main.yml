---
- name: Install chezmoi on Arch
  become: true
  kewlfft.aur.aur:
    name: chezmoi
    use: auto
    state: present
  become_user: aur_builder
  when: ansible_facts["os_family"] == "Archlinux"
  tags:
    - aur

- name: Install chezmoi on Ubuntu or Debian via Homebrew
  community.general.homebrew:
    name: chezmoi
    state: present
  when: ansible_facts["os_family"] == "Debian"
  environment:
    PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts['env']['PATH'] }}"

# The dotfiles' .chezmoi.toml.tmpl asks machine-specific questions with
# promptBoolOnce/promptStringOnce, which open /dev/tty and fail under Ansible
# (no TTY). promptOnce functions return a value already present in the config
# data without prompting, so pre-seed ~/.config/chezmoi/chezmoi.toml from
# dotfiles_config.data before init. force: false preserves the config that a
# previous successful init generated from the repo's template.
- name: Create chezmoi config directory
  become: true
  become_user: "{{ user.name }}"
  ansible.builtin.file:
    path: "/home/{{ user.name }}/.config/chezmoi"
    state: directory
    mode: '0755'
  when: dotfiles_config is defined and dotfiles_config.data | default({}) | length > 0

- name: Pre-seed chezmoi config with prompted data values
  become: true
  become_user: "{{ user.name }}"
  ansible.builtin.template:
    src: chezmoi-config.j2
    dest: "/home/{{ user.name }}/.config/chezmoi/chezmoi.toml"
    mode: '0644'
    force: false
  when: dotfiles_config is defined and dotfiles_config.data | default({}) | length > 0

# `become_user` resets PATH to a minimal secure_path that does NOT include
# /home/linuxbrew/.linuxbrew/bin (where chezmoi is installed on Debian), so we
# must add it explicitly or the `chezmoi` binary is not found.
# The repo must be a POSITIONAL argument to `chezmoi init` — `--source` sets
# the source *directory*, not the repo URL, so passing the URL to --source
# silently initialized an empty repo and never applied any dotfiles.
# `--force` makes the apply non-interactive: a drifted managed file (e.g. nvim's
# lazy-lock.json, which changes whenever plugins update) would otherwise prompt
# "overwrite?" on a TTY and fail under Ansible (no /dev/tty).

- name: Initialize user dotfiles with chezmoi
  become: true
  ansible.builtin.command: >
    chezmoi init
    --apply
    --force
    --branch="{{ dotfiles_config.branch | default('main') }}"
    -- "{{ dotfiles_config.repo_url }}"
  changed_when: true
  when: dotfiles_config is defined
  become_user: "{{ user.name }}"
  environment:
    HOME: "/home/{{ user.name }}"
    PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts['env']['PATH'] }}"

# ~/.tool-versions is DERIVED from group_vars/all/base.yml (asdf_plugins),
# not dotfiles-managed: the chezmoi copy drifted and pinned uninstalled
# versions (breaking e.g. helm), so the dotfiles repo no longer ships
# dot_tool-versions and ignores the path via .chezmoiignore. Rendering runs
# AFTER `chezmoi init --apply` — the last task touching the file.
- name: Render user .tool-versions from asdf_plugins
  become: true
  become_user: "{{ user.name }}"
  ansible.builtin.template:
    src: templates/tool-versions.j2
    dest: "/home/{{ user.name }}/.tool-versions"
    mode: '0644'
  when: dotfiles_config is defined and dotfiles_asdf_plugins | length > 0

- name: Create global gitconfig
  ansible.builtin.template:
    src: templates/gitconfig.j2
    dest: "/home/{{ user.name }}/.gitconfig"
    force: true
    mode: '0644'

---
- name: Install chezmoi on Arch
  become: true
  community.general.pacman:
    name: chezmoi
    state: present
  when: ansible_facts["os_family"] == "Archlinux"
  tags:
    - aur

- name: Install chezmoi on Ubuntu or Debian via Homebrew
  community.general.homebrew:
    name: chezmoi
    state: present
  when: ansible_facts["os_family"] == "Debian"
  environment:
    PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts['env']['PATH'] }}"

# The dotfiles' .chezmoi.toml.tmpl asks machine-specific questions with
# promptBoolOnce/promptStringOnce, which open /dev/tty and fail under Ansible
# (no TTY). promptOnce functions return a value already present in the config
# data without prompting, so pre-seed ~/.config/chezmoi/chezmoi.toml from
# dotfiles_config.data before init. force: false preserves the config that a
# previous successful init generated from the repo's template.
- name: Create chezmoi config directory
  become: true
  become_user: "{{ user.name }}"
  ansible.builtin.file:
    path: "/home/{{ user.name }}/.config/chezmoi"
    state: directory
    mode: '0755'
  when: dotfiles_config is defined and dotfiles_config.data | default({}) | length > 0

- name: Pre-seed chezmoi config with prompted data values
  become: true
  become_user: "{{ user.name }}"
  ansible.builtin.template:
    src: chezmoi-config.j2
    dest: "/home/{{ user.name }}/.config/chezmoi/chezmoi.toml"
    mode: '0644'
    force: false
  when: dotfiles_config is defined and dotfiles_config.data | default({}) | length > 0

# `become_user` resets PATH to a minimal secure_path that does NOT include
# /home/linuxbrew/.linuxbrew/bin (where chezmoi is installed on Debian), so we
# must add it explicitly or the `chezmoi` binary is not found.
# The repo must be a POSITIONAL argument to `chezmoi init` — `--source` sets
# the source *directory*, not the repo URL, so passing the URL to --source
# silently initialized an empty repo and never applied any dotfiles.
# `--force` makes the apply non-interactive: a drifted managed file (e.g. nvim's
# lazy-lock.json, which changes whenever plugins update) would otherwise prompt
# "overwrite?" on a TTY and fail under Ansible (no /dev/tty).

- name: Initialize user dotfiles with chezmoi
  become: true
  ansible.builtin.command: >
    chezmoi init
    --apply
    --force
    --branch="{{ dotfiles_config.branch | default('main') }}"
    -- "{{ dotfiles_config.repo_url }}"
  changed_when: true
  when: dotfiles_config is defined
  become_user: "{{ user.name }}"
  environment:
    HOME: "/home/{{ user.name }}"
    PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts['env']['PATH'] }}"
    # Hermetic first clone. ~/.gitconfig rewrites github.com HTTPS to SSH
    # (url.insteadOf), which fails before the user's SSH key exists, and
    # anonymous protocol-v2 requests over HTTP/2 get 401-challenged by
    # GitHub (see the http.version workaround in templates/gitconfig.j2).
    # Ignore the global gitconfig and force HTTP/1.1 for the init clone
    # only; the public repo needs no credentials this way. The
    # .chezmoiexternal repos (nvim, tmux) are declared with SSH URLs —
    # rewrite those to anonymous HTTPS too; no private key exists yet.
    GIT_CONFIG_GLOBAL: /dev/null
    GIT_CONFIG_COUNT: "2"
    GIT_CONFIG_KEY_0: http.https://github.com/.version
    GIT_CONFIG_VALUE_0: HTTP/1.1
    GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
    GIT_CONFIG_VALUE_1: "git@github.com:"

# Yazi plugins/flavors are declared in the dotfiles-managed
# ~/.config/yazi/package.toml, each pinned to a rev. `ya pkg install` (no
# arguments) deploys exactly that manifest, but it unconditionally redeploys
# every entry — even when all packages are already deployed — and it needs
# network every time, so it is gated on drift:
#   - a declared package dir missing from ~/.config/yazi/{plugins,flavors}
#     (fresh machine, or a package deleted outside the playbook), or
#   - a manifest whose sha256 differs from the one recorded after the last
#     successful deploy (catches pin bumps and any other manifest edit).
# The marker lives in ~/.cache/yazi, which chezmoi does not manage.
# Note: `ya pkg list` is NOT an installed-state query — strace shows it only
# reads package.toml — so it cannot be used as a drift oracle.
# Machines without yazi (installed by the filemanager role on Arch with a
# display, or via Homebrew elsewhere) or without a manifest skip all of this.
- name: Check for the yazi package manager
  ansible.builtin.stat:
    path: "{{ '/usr/bin/ya'
              if ansible_facts['os_family'] == 'Archlinux'
              else '/home/linuxbrew/.linuxbrew/bin/ya' }}"
  register: _dotfiles_ya

- name: Check for the yazi package manifest
  ansible.builtin.stat:
    path: "/home/{{ user.name }}/.config/yazi/package.toml"
  register: _dotfiles_yazi_manifest
  when: _dotfiles_ya.stat.exists

# The manifest is parsed with plain string splits: the `toml` lookup is gone
# (community.general 13 removed it) and this ansible-core's regex filters
# return full matches rather than capture groups. The format is stable,
# machine-written by ya: `[[plugin.deps]]`/`[[flavor.deps]]` section headers
# followed by `use = "repo:name"` entries; the deployed dir is the last
# path segment of `use` under plugins/ or flavors/, suffixed .yazi.
- name: Record yazi packages wanted by the manifest
  ansible.builtin.set_fact:
    _dotfiles_yazi_manifest_hash: "{{ _raw | hash('sha256') }}"
    _dotfiles_yazi_expected_dirs: >-
      {%- set ns = namespace(kind='', dirs=[]) -%}
      {%- for line in _raw.split('\n') -%}
      {%-   if line.startswith('[[') -%}
      {%-     set ns.kind = 'plugins' if 'plugin.deps' in line
                else ('flavors' if 'flavor.deps' in line else '') -%}
      {%-   elif ns.kind and line.startswith('use = ') -%}
      {%-     set name = line.split('"')[1].split(':')[-1].split('/')[-1] -%}
      {%-     set ns.dirs = ns.dirs + ['/home/' ~ user.name
                ~ '/.config/yazi/' ~ ns.kind ~ '/' ~ name ~ '.yazi'] -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.dirs }}
  vars:
    _raw: "{{ lookup('ansible.builtin.file',
            '/home/' ~ user.name ~ '/.config/yazi/package.toml') }}"
  when:
    - _dotfiles_ya.stat.exists
    - _dotfiles_yazi_manifest.stat.exists | default(false)

- name: Check deployed yazi package directories
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ _dotfiles_yazi_expected_dirs | default([]) }}"
  loop_control:
    label: "{{ item }}"
  register: _dotfiles_yazi_deployed
  when:
    - _dotfiles_ya.stat.exists
    - _dotfiles_yazi_manifest.stat.exists | default(false)

# become_user resets PATH to a secure_path without the linuxbrew bin dir,
# so add it explicitly or `ya` is not found on Debian (same as chezmoi
# above). On Arch the extra prefix is harmless.
- name: Install yazi packages pinned in the manifest
  ansible.builtin.command: ya pkg install
  become: true
  become_user: "{{ user.name }}"
  environment:
    HOME: "/home/{{ user.name }}"
    PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts['env']['PATH'] }}"
  vars:
    _dotfiles_yazi_missing: >-
      {{ _dotfiles_yazi_deployed.results | default([])
         | selectattr('stat.exists', 'equalto', false)
         | map(attribute='item') | list }}
    _dotfiles_yazi_marker: "{{ lookup('ansible.builtin.file',
            '/home/' ~ user.name ~ '/.cache/yazi/pkg-apply.sha256',
            errors='ignore') }}"
  when:
    - _dotfiles_ya.stat.exists
    - _dotfiles_yazi_manifest.stat.exists | default(false)
    - _dotfiles_yazi_missing | length > 0
      or _dotfiles_yazi_marker != _dotfiles_yazi_manifest_hash

# Written only after a successful deploy (the install task fails hard and
# the resilient wrapper stops the role on error), so a half-applied
# manifest never poisons the marker.
- name: Record the deployed manifest hash
  ansible.builtin.copy:
    content: "{{ _dotfiles_yazi_manifest_hash }}"
    dest: "/home/{{ user.name }}/.cache/yazi/pkg-apply.sha256"
    mode: '0644'
  become: true
  become_user: "{{ user.name }}"
  when:
    - _dotfiles_ya.stat.exists
    - _dotfiles_yazi_manifest.stat.exists | default(false)

# ~/.tool-versions is DERIVED from group_vars/all/base.yml (asdf_plugins),
# not dotfiles-managed: the chezmoi copy drifted and pinned uninstalled
# versions (breaking e.g. helm), so the dotfiles repo no longer ships
# dot_tool-versions and ignores the path via .chezmoiignore. Rendering runs
# AFTER `chezmoi init --apply` — the last task touching the file.
- name: Render user .tool-versions from asdf_plugins
  become: true
  become_user: "{{ user.name }}"
  ansible.builtin.template:
    src: tool-versions.j2
    dest: "/home/{{ user.name }}/.tool-versions"
    mode: '0644'
  when: dotfiles_config is defined and dotfiles_asdf_plugins | length > 0

- name: Create global gitconfig
  ansible.builtin.template:
    src: templates/gitconfig.j2
    dest: "/home/{{ user.name }}/.gitconfig"
    force: true
    mode: '0644'

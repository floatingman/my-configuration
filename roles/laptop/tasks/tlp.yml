---
- name: Install TLP
  become: true
  ansible.builtin.package:
    name:
      - ethtool
      - tlp
      - tlp-rdw
    state: present
  tags:
    - tlp

- name: Push TLP battery threshold config
  become: true
  ansible.builtin.copy:
    src: tlp/20-battery.conf
    dest: /etc/tlp.d/
    mode: '0644'
  notify:
    - Restart tlp
  tags:
    - tlp

- name: Push TLP radio device config
  become: true
  ansible.builtin.copy:
    src: tlp/20-rdw.conf
    dest: /etc/tlp.d/
    mode: '0644'
  notify:
    - Restart tlp
  tags:
    - tlp

- name: Push TLP PCIe config
  become: true
  ansible.builtin.copy:
    src: tlp/20-pcie.conf
    dest: /etc/tlp.d/
    mode: '0644'
  notify:
    - Restart tlp
  tags:
    - tlp

- name: Mask systemd radio service
  become: true
  ansible.builtin.systemd:
    name: systemd-rfkill.service
    masked: true
  tags:
    - tlp

- name: Mask systemd radio socket
  become: true
  ansible.builtin.systemd:
    name: systemd-rfkill.socket
    masked: true
  tags:
    - tlp

- name: Enable TLP
  become: true
  ansible.builtin.service:
    name: tlp.service
    enabled: true
  tags:
    - tlp

- name: Check for leftover TuneD charge thresholds unit
  ansible.builtin.stat:
    path: /etc/systemd/system/charge-thresholds.service
  register: _laptop_tuned_thresholds_unit
  tags:
    - tlp

- name: Stop and disable leftover TuneD charge thresholds service
  become: true
  ansible.builtin.systemd:
    name: charge-thresholds.service
    state: stopped
    enabled: false
  when: _laptop_tuned_thresholds_unit.stat.exists
  tags:
    - tlp

- name: Remove leftover TuneD charge thresholds unit and script
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/charge-thresholds.service
    - /usr/local/bin/charge-thresholds.sh
  when: _laptop_tuned_thresholds_unit.stat.exists
  notify:
    - Reload systemd config
  tags:
    - tlp

- name: Remove TuneD-era iwlwifi power save module option
  # TLP is the sole WiFi power manager on this backend
  become: true
  ansible.builtin.file:
    path: /etc/modprobe.d/iwlwifi-powersave.conf
    state: absent
  tags:
    - tlp

---
- name: Install TuneD
  become: true
  ansible.builtin.package:
    name: tuned-ppd
    state: present
  tags:
    - tuned

- name: Install iw
  become: true
  ansible.builtin.package:
    name: iw
    state: present
  when: laptop_wifi_powersave | bool
  tags:
    - tuned

- name: Install iwlwifi power save module option
  become: true
  ansible.builtin.copy:
    src: iwlwifi-powersave.conf
    dest: /etc/modprobe.d/
    mode: '0644'
  when: laptop_wifi_powersave | bool
  tags:
    - tuned

- name: Apply WiFi power save now
  become: true
  ansible.builtin.command: iw dev {{ item }} set power_save on
  loop: "{{ ansible_facts['interfaces'] | select('match', '^wl') | list }}"
  changed_when: false
  when: laptop_wifi_powersave | bool
  tags:
    - tuned

- name: Remove iwlwifi power save module option
  become: true
  ansible.builtin.file:
    path: /etc/modprobe.d/iwlwifi-powersave.conf
    state: absent
  when: not (laptop_wifi_powersave | bool)
  tags:
    - tuned

- name: Disable WiFi power save now
  become: true
  ansible.builtin.command: iw dev {{ item }} set power_save off
  loop: "{{ ansible_facts['interfaces'] | select('match', '^wl') | list }}"
  changed_when: false
  when: not (laptop_wifi_powersave | bool)
  tags:
    - tuned

- name: Enable and start TuneD
  become: true
  ansible.builtin.service:
    name: tuned.service
    enabled: true
    state: started
  tags:
    - tuned

- name: Install power monitor script
  become: true
  ansible.builtin.template:
    src: power_monitor.sh.j2
    dest: /usr/local/bin/power_monitor.sh
    mode: '0755'
  notify:
    - Restart power monitor
  tags:
    - tuned

- name: Install battery charge threshold script
  become: true
  ansible.builtin.template:
    src: charge-thresholds.sh.j2
    dest: /usr/local/bin/charge-thresholds.sh
    mode: '0755'
  when: ansible_facts['system_vendor'] != "Framework"
  notify:
    - Restart charge thresholds
  tags:
    - tuned

- name: Copy battery charge thresholds service
  become: true
  ansible.builtin.copy:
    src: charge-thresholds.service
    dest: /etc/systemd/system/
    mode: '0644'
  when: ansible_facts['system_vendor'] != "Framework"
  notify:
    - Reload systemd config
    - Restart charge thresholds
  tags:
    - tuned

- name: Enable and start battery charge thresholds service
  become: true
  ansible.builtin.service:
    name: charge-thresholds.service
    enabled: true
    state: started
  when: ansible_facts['system_vendor'] != "Framework"
  tags:
    - tuned

- name: Copy power monitor service
  become: true
  ansible.builtin.copy:
    src: power_monitor.service
    dest: /etc/systemd/system/
    mode: '0644'
  notify:
    - Reload systemd config
    - Restart power monitor
  tags:
    - tuned

- name: Enable and start power monitor service
  become: true
  ansible.builtin.service:
    name: power_monitor.service
    enabled: true
    state: started
  tags:
    - tuned

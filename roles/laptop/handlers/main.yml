---
# Handlers run in definition order: daemon-reload must precede any unit
# restarts so restarted services pick up freshly installed unit files.
- name: Reload systemd config
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart tlp
  become: true
  ansible.builtin.service:
    name: tlp.service
    state: restarted

- name: Restart power monitor
  become: true
  ansible.builtin.service:
    name: power_monitor.service
    state: restarted

- name: Restart charge control
  become: true
  ansible.builtin.service:
    name: chargecontrol.service
    state: restarted

- name: Restart charge thresholds
  become: true
  ansible.builtin.service:
    name: charge-thresholds.service
    state: restarted

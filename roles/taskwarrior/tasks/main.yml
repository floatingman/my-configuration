---
- name: Install taskwarrior
  ansible.builtin.package:
    name: task
    state: present
  become: true

- name: Install timewarrior
  ansible.builtin.package:
    name: timew
    state: present
  notify:
    - Refresh holidays
  become: true

- name: Install taskopen
  become: true
  kewlfft.aur.aur:
    # AUR `taskopen` pins a sha256 for the codeberg source archive that
    # upstream regenerated; -git builds from source and is immune to that.
    name: taskopen-git
    use: auto
    state: present
  become_user: aur_builder
  when: ansible_facts["os_family"] == "Archlinux"
  tags:
    - aur

---
- name: Set cron package and service name
  ansible.builtin.set_fact:
    # RedHat/Fedora's cronie package ships the crond.service unit ("cronie"
    # is only the package name there); Arch and Debian name both the same.
    cron_package: "{{ {'RedHat': 'cronie', 'Archlinux': 'cronie'} | combine({'Debian': 'cron'}) }}"
    cron_service: "{{ {'RedHat': 'crond', 'Archlinux': 'cronie'} | combine({'Debian': 'cron'}) }}"

- name: Install cron
  become: true
  ansible.builtin.package:
    name: "{{ cron_package[ansible_facts['os_family']] }}"
    state: present

- name: Enable cron
  become: true
  ansible.builtin.service:
    name: "{{ cron_service[ansible_facts['os_family']] }}"
    enabled: true
    state: started

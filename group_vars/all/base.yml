---
# Shared base variables for all machines.
# These are the defaults shared between desktop and server configurations.
# Machine-specific overrides (laptop, hostname, display_manager, etc.) live in group_vars/all/local.yml.

# Ansible is installed via pipx under a home directory that is mode 0700.
# Non-root become users (e.g. aur_builder) cannot traverse the home dir to reach
# the pipx venv python, so pin module execution to the system interpreter that
# every user can execute.
ansible_python_interpreter: /usr/bin/python3

user:
  name: dnewman
  uid: 1000
  gid: 1000
  group: dnewman
  shell: /usr/bin/zsh
  email: dan@danlovesprogramming.com
  log:
    dir: log
    rotate: 8

udisks:
  auto_mount: true
  shared_mount: true

bootloader: grub

bluetooth:
  disable: false

browser_choices:
  - firefox
  - brave
  - google-chrome-stable
  - torbrowser-launcher
  - play
  - qcode
  - "| xclip -selection c"

filesystem_packages:
  - dosfstools
  - ntfs-3g
  - exfatprogs
  - gparted
  - udftools

hosts_path: "/etc/hosts"
hosts_backup: "/etc/hosts.original"
hosts_pack: basic
hosts_url: "https://block.energized.pro/{{ hosts_pack }}/formats/hosts"

journal:
  max_size: 500M

sudo_without_password: true

github_user: floatingman

goesimage:
  run_time: 15min
  run_boot_delay: 2min
  run_on: all
  flags: -w -e

ssh_config:
  port: 22
  enable_sshd: true

gnupg:
  enable_agent: true
  emulate_ssh: true

gitconfig:
  name: Daniel Newman
  mail: dan@danlovesprogramming.com
  delta: true
  neovim_remote: true
  meld: true

grub_kernel_parameters: "quiet consoleblank=60"

# GPU configuration
# Options: auto, amd, nvidia, intel
# If not set, defaults to "auto"
gpu_drivers_detection_mode: auto

# Force specific GPU type (overrides detection)
# Only used when gpu_drivers_detection_mode is not "auto"
# gpu_drivers_type: null

# Use proprietary drivers for NVIDIA
# Only applicable when gpu_drivers_type is "nvidia" or auto-detects NVIDIA
# gpu_drivers_nvidia_proprietary: true

# Hybrid GPU configuration
# gpu_drivers_hybrid_install_all: true  # Install drivers for all detected GPUs

lang:
  enabled: true
  arch:
    - python
    - python-pip
    - go

asdf_dir: "/opt/asdf"
asdf_user: "root"
asdf_group: "devtools"
asdf_plugins:

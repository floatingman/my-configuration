# Binaries to install via direct download (not available in Homebrew)
binaries:
  - name: hey
    url: "https://storage.googleapis.com/hey-releases/hey_linux_amd64"
    bin_name: hey_linux_amd64

  - name: aws-iam-authenticator
    url: "https://amazon-eks.s3-us-west-2.amazonaws.com/1.15.10/2020-02-22/bin/linux/amd64/aws-iam-authenticator"

  - name: aws-vault
    url: "https://github.com/ByteNess/aws-vault/releases/download/v{{ aws_vault_version }}/aws-vault-linux-amd64"
    bin_name: aws-vault-linux-amd64

  - name: bit
    url: "https://github.com/chriswalz/bit/releases/download/v{{ bit_version }}/bit_{{ bit_version }}_linux_amd64.tar.gz"
    extract: true

  - name: dog
    url: "https://github.com/ogham/dog/releases/download/{{ dog_version }}/dog-{{ dog_version }}-x86_64-unknown-linux-gnu.zip"
    extract: true
    bin_path: bin

  - name: gh-md-toc
    url: "https://github.com/ekalinin/github-markdown-toc/archive/refs/tags/{{ gh_md_toc_version }}.tar.gz"
    extract: true
    bin_path: github-markdown-toc-{{ gh_md_toc_version }}

  - name: git-quick-stats
    url: "https://github.com/arzzen/git-quick-stats/archive/refs/tags/{{ git_quick_stats_version }}.tar.gz"
    extract: true
    bin_path: git-quick-stats-{{ git_quick_stats_version }}

  - name: prettyping
    url: "https://github.com/denilsonsa/prettyping/archive/refs/tags/{{ prettyping_version }}.tar.gz"
    extract: true
    bin_path: prettyping-{{ prettyping_version }}

  - name: rke
    url: "https://github.com/rancher/rke/releases/download/{{ rke_version }}/rke_linux-amd64"
    bin_name: rke_linux-amd64

  - name: tfswitch
    url: "https://github.com/warrensbox/terraform-switcher/releases/download/\
      v{{ tfswitch_version }}/terraform-switcher_v{{ tfswitch_version }}_linux_amd64.tar.gz"
    extract: true

# Rust cargo packages to install
# Note: Some tools like ripgrep, bat, exa are also available as binaries above.
# Use rust_cargo_packages for tools not available as pre-built binaries or for
# getting the latest versions directly from source.
rust_cargo_packages:
  - cargo-update # Update installed cargo packages
  - cargo-edit # Add/remove dependencies from command line
  - cargo-watch # Watch for changes and run cargo commands
  - cargo-audit # Audit dependencies for security vulnerabilities
  - fd-find
